<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" role="img" aria-label="Masque.jl logo: a gold selection box moves across a grey scatter plot, coloring the points inside it red, green and purple like the Julia logo">
  <style>
    svg {
      --axis: #A3A098; --grey: #ABA8A0; --roi: #B8893A;
      --jr: #CB3C33; --jg: #389826; --jp: #9558B2;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --axis: #5A636C; --grey: #606973; --roi: #D8B46A;
        --jr: #D66661; --jg: #6BAB5B; --jp: #AA79C1;
      }
    }
    .axis { stroke: var(--axis); }
    .grey { fill: var(--grey); }
    .box { fill: var(--roi); stroke: var(--roi); }
    .handles { stroke: var(--roi); }
    .r { fill: var(--jr); } .g { fill: var(--jg); } .p { fill: var(--jp); }
    /* home -> lower left -> upper right -> home; the color layer is clipped to the moving box */
    .move { animation: masque-tour 9s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
    @keyframes masque-tour {
      0%, 12%   { transform: translate(0, 0); }
      25%, 41%  { transform: translate(-56px, 24px); }
      54%, 70%  { transform: translate(38px, -36px); }
      83%, 100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .move { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="masque-roi"><rect class="move" x="76" y="46" width="78" height="66"/></clipPath>
  </defs>
  <path class="axis" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M 12 10 L 12 148 L 192 148"/>
  <g class="grey">
    <circle cx="34" cy="122" r="6"/><circle cx="44" cy="104" r="6"/><circle cx="60" cy="124" r="6"/>
    <circle cx="30" cy="56" r="6"/><circle cx="52" cy="38" r="6"/><circle cx="84" cy="124" r="6"/>
    <circle cx="130" cy="130" r="6"/><circle cx="172" cy="120" r="6"/><circle cx="184" cy="94" r="6"/>
    <circle cx="170" cy="36" r="6"/><circle cx="178" cy="18" r="6"/><circle cx="100" cy="26" r="6"/>
    <circle cx="58" cy="82" r="6"/><circle cx="156" cy="30" r="6"/><circle cx="132" cy="30" r="6"/>
    <circle cx="90" cy="96" r="6"/><circle cx="104" cy="74" r="6"/><circle cx="120" cy="60" r="6"/>
    <circle cx="136" cy="86" r="6"/><circle cx="116" cy="100" r="6"/><circle cx="140" cy="62" r="6"/>
  </g>
  <g class="move"><rect class="box" x="76" y="46" width="78" height="66" fill-opacity="0.10" stroke-width="3.5"/></g>
  <g clip-path="url(#masque-roi)">
    <circle class="r" cx="34" cy="122" r="6.5"/><circle class="g" cx="44" cy="104" r="6.5"/><circle class="p" cx="60" cy="124" r="6.5"/>
    <circle class="g" cx="30" cy="56" r="6.5"/><circle class="r" cx="52" cy="38" r="6.5"/><circle class="g" cx="84" cy="124" r="6.5"/>
    <circle class="p" cx="130" cy="130" r="6.5"/><circle class="r" cx="172" cy="120" r="6.5"/><circle class="g" cx="184" cy="94" r="6.5"/>
    <circle class="p" cx="170" cy="36" r="6.5"/><circle class="r" cx="178" cy="18" r="6.5"/><circle class="g" cx="100" cy="26" r="6.5"/>
    <circle class="r" cx="58" cy="82" r="6.5"/><circle class="g" cx="156" cy="30" r="6.5"/><circle class="p" cx="132" cy="30" r="6.5"/>
    <circle class="p" cx="90" cy="96" r="6.5"/><circle class="r" cx="104" cy="74" r="6.5"/><circle class="g" cx="120" cy="60" r="6.5"/>
    <circle class="p" cx="136" cy="86" r="6.5"/><circle class="g" cx="116" cy="100" r="6.5"/><circle class="r" cx="140" cy="62" r="6.5"/>
  </g>
  <g class="move handles" fill="#FFFFFF" stroke-width="3">
    <rect x="70" y="40" width="12" height="12" rx="2"/>
    <rect x="148" y="40" width="12" height="12" rx="2"/>
    <rect x="70" y="106" width="12" height="12" rx="2"/>
    <rect x="148" y="106" width="12" height="12" rx="2"/>
  </g>
</svg>
