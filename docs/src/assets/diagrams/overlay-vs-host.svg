<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470"
     role="img">
  <title>Where the notebook runs</title>
  <desc>Where the notebook runs: live Pluto, a recorded example on this site, a hover-only example on this site, and a static HTML export. Hover and the highlight after a click work in all four. Clicking a mark updates @bind and cells respond in live Pluto, shows a recorded result in a recorded example, and leaves cells unchanged in a hover-only example or a static export. Releasing a brush box, or picking a recorded axis or threshold position, follows the same split. Other drag positions update @bind on release in live Pluto, and elsewhere cells keep the last recorded, starting, or exported value. Clicking a heatmap cell shows a tooltip everywhere, and a result in live Pluto or a recorded example. Pan and orbit need live Pluto; this site shows them as video clips, and they never change @bind.</desc>
  <style>
    .ink { fill: #1b1f24; }
    .muted { fill: #5c6570; }
    .grid { fill: none; stroke: #c8c4bb; }
    .h0 { fill: #e8efe6; }
    .h1 { fill: #e4eef6; }
    .h2 { fill: #efe8d8; }
    .h3 { fill: #f4f1ea; }
    .rowalt { fill: #000; opacity: 0.04; }
    .yes { fill: #1b1f24; font-weight: 600; }
  </style>

  <text class="ink" x="400" y="22" text-anchor="middle" font-size="14"
        font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Where the notebook runs</text>
  <text class="muted" x="400" y="40" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Same gesture, four places the figure can run.</text>

  <rect class="h0" x="176" y="52" width="151" height="400" rx="4"/>
  <rect class="h1" x="327" y="52" width="151" height="400" rx="4"/>
  <rect class="h2" x="478" y="52" width="151" height="400" rx="4"/>
  <rect class="h3" x="629" y="52" width="151" height="400" rx="4"/>

  <rect class="rowalt" x="16" y="148" width="764" height="48"/>
  <rect class="rowalt" x="16" y="244" width="764" height="48"/>
  <rect class="rowalt" x="16" y="340" width="764" height="48"/>

  <g class="grid" stroke-width="1">
    <line x1="16" y1="100" x2="780" y2="100"/>
    <line x1="16" y1="148" x2="780" y2="148"/>
    <line x1="16" y1="196" x2="780" y2="196"/>
    <line x1="16" y1="244" x2="780" y2="244"/>
    <line x1="16" y1="292" x2="780" y2="292"/>
    <line x1="16" y1="340" x2="780" y2="340"/>
    <line x1="16" y1="388" x2="780" y2="388"/>
    <line x1="176" y1="52" x2="176" y2="452"/>
    <line x1="327" y1="52" x2="327" y2="452"/>
    <line x1="478" y1="52" x2="478" y2="452"/>
    <line x1="629" y1="52" x2="629" y2="452"/>
  </g>
  <rect class="grid" x="16" y="52" width="764" height="400" rx="4" stroke-width="1.25"/>

  <!-- Headers -->
  <text class="ink" x="96" y="80" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Gesture</text>
  <text class="ink" x="251" y="72" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Live Pluto</text>
  <text class="ink" x="402" y="68" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">This site</text>
  <text class="muted" x="402" y="82" text-anchor="middle" font-size="10"
        font-family="ui-sans-serif, system-ui, sans-serif">recorded</text>
  <text class="muted" x="402" y="94" text-anchor="middle" font-size="10"
        font-family="ui-sans-serif, system-ui, sans-serif">example</text>
  <text class="ink" x="553" y="68" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">This site</text>
  <text class="muted" x="553" y="82" text-anchor="middle" font-size="10"
        font-family="ui-sans-serif, system-ui, sans-serif">hover only</text>
  <text class="ink" x="704" y="68" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">Static</text>
  <text class="muted" x="704" y="82" text-anchor="middle" font-size="10"
        font-family="ui-sans-serif, system-ui, sans-serif">HTML export</text>

  <!-- Hover -->
  <text class="ink" x="96" y="128" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Hover</text>
  <text class="yes" x="251" y="128" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>
  <text class="yes" x="402" y="128" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>
  <text class="yes" x="553" y="128" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>
  <text class="yes" x="704" y="128" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>

  <!-- Click-echo -->
  <text class="ink" x="96" y="176" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Click highlight</text>
  <text class="yes" x="251" y="176" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>
  <text class="yes" x="402" y="176" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>
  <text class="yes" x="553" y="176" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>
  <text class="yes" x="704" y="176" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Yes</text>

  <!-- Element click bind -->
  <text class="ink" x="96" y="216" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Click a mark</text>
  <text class="ink" x="96" y="230" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">(all cells below)</text>
  <text class="yes" x="251" y="216" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">@bind updates;</text>
  <text class="yes" x="251" y="230" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">cells respond</text>
  <text class="yes" x="402" y="216" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Recorded result</text>
  <text class="yes" x="402" y="230" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">in every cell</text>
  <text class="muted" x="553" y="216" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Cells keep</text>
  <text class="muted" x="553" y="230" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">starting value</text>
  <text class="muted" x="704" y="216" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Cells keep</text>
  <text class="muted" x="704" y="230" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">export value</text>

  <!-- Listed ROI / axis / threshold -->
  <text class="ink" x="96" y="264" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Brush box, or a</text>
  <text class="ink" x="96" y="278" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">recorded position</text>
  <text class="yes" x="251" y="271" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">@bind on release</text>
  <text class="yes" x="402" y="264" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Recorded result</text>
  <text class="yes" x="402" y="278" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">for each one</text>
  <text class="muted" x="553" y="264" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Cells keep</text>
  <text class="muted" x="553" y="278" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">starting value</text>
  <text class="muted" x="704" y="264" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Cells keep</text>
  <text class="muted" x="704" y="278" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">export value</text>

  <!-- Unlisted drag -->
  <text class="ink" x="96" y="312" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Other drag</text>
  <text class="ink" x="96" y="326" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">positions</text>
  <text class="yes" x="251" y="312" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">@bind updates</text>
  <text class="yes" x="251" y="326" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">on release</text>
  <text class="muted" x="402" y="312" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Cells keep last</text>
  <text class="muted" x="402" y="326" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">recorded result</text>
  <text class="muted" x="553" y="312" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Cells keep</text>
  <text class="muted" x="553" y="326" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">starting value</text>
  <text class="muted" x="704" y="312" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Cells keep</text>
  <text class="muted" x="704" y="326" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">export value</text>

  <!-- Heatmap -->
  <text class="ink" x="96" y="360" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Heatmap cell</text>
  <text class="ink" x="96" y="374" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">click</text>
  <text class="yes" x="251" y="360" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Tooltip; @bind</text>
  <text class="yes" x="251" y="374" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">on click</text>
  <text class="muted" x="402" y="360" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Tooltip; clicks</text>
  <text class="muted" x="402" y="374" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">show results</text>
  <text class="yes" x="553" y="360" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Tooltip;</text>
  <text class="yes" x="553" y="374" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">cells unchanged</text>
  <text class="muted" x="704" y="360" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Tooltip; cells</text>
  <text class="muted" x="704" y="374" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">unchanged</text>

  <!-- Cairo view -->
  <text class="ink" x="96" y="416" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Pan or orbit</text>
  <text class="ink" x="96" y="430" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">(never @bind)</text>
  <text class="yes" x="251" y="416" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Julia redraws</text>
  <text class="yes" x="251" y="430" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">the view</text>
  <text class="muted" x="402" y="416" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Shown as a</text>
  <text class="muted" x="402" y="430" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">video clip</text>
  <text class="muted" x="553" y="416" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">Tooltip only;</text>
  <text class="muted" x="553" y="430" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">view stays</text>
  <text class="muted" x="704" y="416" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">View stays;</text>
  <text class="muted" x="704" y="430" text-anchor="middle" font-size="11"
        font-family="ui-sans-serif, system-ui, sans-serif">site uses clips</text>
</svg>
