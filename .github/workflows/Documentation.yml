name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Like CI's heavy jobs, a draft PR builds the docs once it is marked ready for review, or
    # with the `full-ci` label from the next push (no `labeled` trigger: see CI.yml).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # JULIA_CPU_TARGET=generic: runners differ in CPU, and a native pkgimage built on one is
      # rejected and rebuilt on another, so most runs rebuilt all ~310 packages even when the
      # cache restored. Generic images load on every runner; the build step runs native.
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        env:
          JULIA_CPU_TARGET: generic
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      # Before the build: it measures each player's height in Chromium before deploying.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      # Harvested players and measured heights are reused on pull requests only: main and tag
      # builds always build them fresh, and main saves them for the pull requests after it, so a
      # deployed page never comes from the cache. See export_embeds.jl and measure_players.mjs for what each is keyed on.
      - name: Restore docs build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/embed-cache
            ${{ runner.temp }}/heights.json
          key: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docs-build-
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          MASQUE_MEASURE_PLAYERS: 'true'
          MASQUE_EMBED_CACHE: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && format('{0}/embed-cache', runner.temp) || '' }}
          MASQUE_HEIGHT_CACHE: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && format('{0}/heights.json', runner.temp) || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Save docs build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/embed-cache
            ${{ runner.temp }}/heights.json
          key: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
      # Pull requests restore only the newest, so drop the older ones before they count against
      # the repo's cache limit with CI's Julia envs.
      - name: Delete older docs build caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: docs-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key docs-build- --limit 100 --json key --jq '.[].key' |
            while read -r key; do
              [ "$key" = "$KEEP" ] || gh cache delete "$key" --repo "$GITHUB_REPOSITORY" || true
            done
      - name: Playwright docs player
        working-directory: test/e2e
        run: node docs_player.mjs "$GITHUB_WORKSPACE/docs/build"
      # A registered install loads the overlay script from jsDelivr; the driver serves this
      # checkout's bundle at that URL (#311).
      - name: Playwright overlay script from jsDelivr
        run: |
          julia --color=yes --project=docs test/e2e/standalone_cdn.jl "$RUNNER_TEMP/cdn"
          cd test/e2e && node standalone_cdn.mjs "$RUNNER_TEMP/cdn"
