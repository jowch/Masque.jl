name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Like CI's heavy jobs, a draft PR builds the docs once it is marked ready for review, or
    # with the `full-ci` label from the next push (no `labeled` trigger: see CI.yml).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      # Before the build: it measures each player's height in Chromium before deploying.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          MASQUE_MEASURE_PLAYERS: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Playwright docs player
        working-directory: test/e2e
        run: node docs_player.mjs "$GITHUB_WORKSPACE/docs/build"
      # A registered install loads the overlay script from jsDelivr; the driver serves this
      # checkout's bundle at that URL (#311).
      - name: Playwright overlay script from jsDelivr
        run: |
          julia --color=yes --project=docs test/e2e/standalone_cdn.jl "$RUNNER_TEMP/cdn"
          cd test/e2e && node standalone_cdn.mjs "$RUNNER_TEMP/cdn"
