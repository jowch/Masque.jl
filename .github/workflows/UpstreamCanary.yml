name: Upstream canary

# Runs Masque's accessor canaries (test/makie_compat_tests.jl and test/wgl_compat_tests.jl),
# then the WebGL kind sweep (test/e2e/kind_sweep.mjs), against Makie master, so a change to an internal Masque reads shows up the night it lands
# rather than when a release moves the compat bound. Advisory: it is not a required check and
# never runs on pull requests, but a canary failure fails the run (no continue-on-error), so a
# break is red in the Actions tab. CompatHelper covers released versions; this covers master.
# Project.toml compat is not touched here, and GLMakie is never installed.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Accessor canaries on Makie master
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAKIE_CHECKOUT: ${{ github.workspace }}/upstream/Makie.jl
      CANARY_ENV: ${{ github.workspace }}/upstream/canary-env
    steps:
      - uses: actions/checkout@v4
      - name: Check out MakieOrg/Makie.jl master
        uses: actions/checkout@v4
        with:
          repository: MakieOrg/Makie.jl
          ref: master
          path: upstream/Makie.jl
          fetch-depth: 1
      - name: Record upstream commit
        run: echo "MAKIE_COMMIT=$(git -C "$MAKIE_CHECKOUT" rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v2
        with:
          # The latest release, not Masque's 1.10 floor: master may raise its own Julia floor
          # (WGLMakie master needs 1.11 since MakieOrg/Makie.jl#5584), and on 1.10 that refuses
          # resolution before any canary runs (#661). The `Compat floor` CI job covers 1.10
          # against released versions.
          version: '1'
      - uses: julia-actions/cache@v2
      # Resolution: Masque plus ComputePipeline, Makie, CairoMakie, and WGLMakie from the
      # checkout. A refusal here means master left Masque's one-minor pin (or the running
      # Julia), and is reported as that, not as a canary failure.
      - name: Develop Makie master
        run: julia test/upstream/canary.jl setup "$MAKIE_CHECKOUT" "$CANARY_ENV"
      # The WebGL kind sweep below runs its notebook in this env through Pluto. Added before
      # `load`, so one precompile covers both.
      - name: Add the kind sweep's packages
        run: julia --project="$CANARY_ENV" -e 'using Pkg; Pkg.add("JSON3"); Pkg.add(name = "Pluto", version = "1")'
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
      # Precompile and load, then log pkgversion of Makie, CairoMakie, WGLMakie and the commit.
      - name: Load Makie master
        id: load
        run: julia --project="$CANARY_ENV" test/upstream/canary.jl load "$MAKIE_CHECKOUT"
      - name: Makie accessor canary
        run: julia --project="$CANARY_ENV" test/upstream/canary.jl makie
      - name: WGL accessor canary
        # Runs even when the Makie canary failed, so one run reports both.
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: julia --project="$CANARY_ENV" test/upstream/canary.jl wgl
      # The accessor canaries are Julia-side only. A break in the browser, such as a new
      # `setup_scene_init` parameter (#660), shows only when a widget mounts (#663). One driver,
      # the WebGL kind sweep, as CI's kind-sweep job runs it.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: WebGL kind sweep
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        working-directory: test/e2e
        env:
          MASQUE_DEV_ENV: ${{ env.CANARY_ENV }}
          MASQUE_PLUTO_IN_PROCESS: '1'
        run: |
          NOTEBOOK="$GITHUB_WORKSPACE/test/e2e/kind_sweep_webgl.jl"
          julia serve.jl 1240 > pluto.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true; tail -n 200 pluto.log' EXIT
          up=
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:1240 || echo 000)
            [ "$code" = "200" ] && { up=1; break; }
            sleep 2
          done
          [ -n "$up" ] || { echo "::error title=Pluto never came up::on :1240 against MakieOrg/Makie.jl@$MAKIE_COMMIT"; exit 1; }
          node kind_sweep.mjs http://127.0.0.1:1240 "$NOTEBOOK" webgl "$RUNNER_TEMP" || {
            echo "::error title=WebGL kind sweep failed::against MakieOrg/Makie.jl@$MAKIE_COMMIT. The log above names the failing case."
            exit 1
          }
