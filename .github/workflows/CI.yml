name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft runs only lint until it is marked ready. labeled: adding `full-ci`
    # to a draft runs the full suite on it (see the `changes` job).
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# needed for the bundle commit-back on main (CI is the sole author of
# assets/overlay.js and assets/masque-webgl.js)
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# How the Julia jobs share work: `setup` and `setup-lts` each resolve the shared test env once
# (scripts/cloud-warm.sh, the env cloud dev sessions use) and precompile it only when no cache
# holds that exact manifest yet. Every other Julia job restores that depot and runs against
# MASQUE_DEV_ENV, so the Makie stack compiles once per Julia version, not once per job.

jobs:
  changes:
    # Decides whether the Julia, sweep and fixture jobs run. They skip when
    # - the PR is a draft without the `full-ci` label: CI runs once the work is ready
    #   (marking it ready for review runs it), and a thread that needs full CI on a draft adds
    #   the label;
    # - the PR only touches prose (docs/src, docs/dev, *.md); the Documentation workflow still
    #   builds and checks the docs.
    # The skip is a job-level `if`, so a required check that skips counts as passed (a
    # workflow-level `paths:` filter would leave it pending and block the merge). The PR is read
    # fresh, so every run on the same PR state decides the same way, whichever event started it.
    # Pushes to main run everything.
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("code", "true")
              return
            }
            const pull = { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number }
            const { data: pr } = await github.rest.pulls.get(pull)
            const labels = pr.labels.map((l) => l.name)
            if (pr.draft && !labels.includes("full-ci")) {
              core.notice("Draft PR: the Julia, sweep and fixture jobs run once it is marked ready for review, or with the `full-ci` label.")
              core.setOutput("code", "false")
              return
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { ...pull, per_page: 100 })
            const prose = (p) => /^docs\/(src|dev)\//.test(p) || /\.md$/.test(p)
            const code = files.filter((f) => !prose(f.filename) || (f.previous_filename && !prose(f.previous_filename)))
            core.info(`${files.length} changed file(s), ${code.length} outside docs/src, docs/dev and *.md`)
            for (const f of code.slice(0, 20)) core.info(`  ${f.filename}`)
            core.setOutput("code", code.length > 0 ? "true" : "false")

  setup:
    name: Setup (Julia 1)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.env.outputs.key }}
      julia-version: ${{ steps.env.outputs.julia-version }}
    steps:
      - uses: actions/checkout@v4
      - id: env
        uses: ./.github/actions/julia-env-build
        with:
          version: '1'

  setup-lts:
    # Julia 1.10 is the compat floor.
    name: Setup (Julia 1.10)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.env.outputs.key }}
      julia-version: ${{ steps.env.outputs.julia-version }}
    steps:
      - uses: actions/checkout@v4
      - id: env
        uses: ./.github/actions/julia-env-build
        with:
          version: '1.10'

  julia:
    # Julia 1 runs Core, then the no-backend group. Julia 1.10 runs Core, then the
    # WebGL extension group. Each group is its own `julia` process: the no-backend group must
    # never load CairoMakie or WGLMakie, and the WebGL group needs WGLMakie loaded.
    name: Julia ${{ matrix.version }}
    needs: [setup, setup-lts]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/julia-env
        with:
          julia-version: ${{ matrix.version == '1.10' && needs.setup-lts.outputs.julia-version || needs.setup.outputs.julia-version }}
          key: ${{ matrix.version == '1.10' && needs.setup-lts.outputs.key || needs.setup.outputs.key }}
      # Coverage tracks this checkout only (`@path`), so the restored dependency images still
      # load; nothing is recompiled for it.
      - name: Core tests
        env:
          GROUP: Core
        run: julia --color=yes --code-coverage=@"$GITHUB_WORKSPACE" --project="$MASQUE_DEV_ENV" test/runtests.jl
      - name: No-backend error path
        if: matrix.version == '1' && !cancelled()
        env:
          GROUP: NoBackend
        run: julia --color=yes --code-coverage=@"$GITHUB_WORKSPACE" --project="$MASQUE_DEV_ENV" test/runtests.jl
      - name: WGLMakie extension
        if: matrix.version == '1.10' && !cancelled()
        env:
          GROUP: WebGL
        run: julia --color=yes --code-coverage=@"$GITHUB_WORKSPACE" --project="$MASQUE_DEV_ENV" test/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: julia-${{ matrix.version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  webgl-bind-e2e:
    # THROUGH-Pluto `@bind` E2E on the Pluto 0.20 series: a live headless Pluto kernel + real
    # Chromium. The one remaining 0.20 check; it covers the WebGL `@bind` round-trip only, not
    # the kind sweep or Cairo. Drop it at 0.5.0. On Pluto 1 the WebGL kind sweep already clicks
    # every kind and reads the bound value back through Pluto.
    name: WGLMakie bind E2E (Pluto 0.20)
    needs: setup-lts
    runs-on: ubuntu-latest
    # Worst case inside "Through-Pluto bind round-trip": 25min mount + 2×5min PLUTO_MS attempts
    # ≈ 35min, plus the port-readiness loop (≤4min) and setup steps before it — 45min leaves
    # headroom so a legitimate cold-cache run doesn't race the job-level timeout (which would
    # cancel, not fail, the step and skip the artifact upload below).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/julia-env
        with:
          julia-version: ${{ needs.setup-lts.outputs.julia-version }}
          key: ${{ needs.setup-lts.outputs.key }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/package.json') }}
      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Through-Pluto bind round-trip
        working-directory: test/e2e
        env:
          # serve.jl puts this series in its own env; the notebook runs on MASQUE_DEV_ENV.
          PLUTO_VERSION: '0.20'
        run: |
          julia serve.jl 1234 > pluto.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          up=
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:1234 || echo 000)
            [ "$code" = "200" ] && { up=1; break; }
            sleep 2
          done
          [ -n "$up" ] || { echo "::error::Pluto never came up on :1234"; cat pluto.log; exit 1; }
          node bind_click.mjs http://127.0.0.1:1234 "$GITHUB_WORKSPACE/test/e2e/bind_notebook.jl" "$RUNNER_TEMP/bind-e2e-artifacts"
      - name: Pluto server log (precompile + render timing)
        if: always()
        working-directory: test/e2e
        run: tail -n 200 pluto.log || true
      - name: Upload failure artifacts (screenshot, DOM dump, Pluto log)
        # cancelled(), not just failure(): a job-level timeout-minutes kill marks the running
        # step "cancelled", not "failed" — failure() alone would silently skip this exact upload
        # on the one occasion (a genuine timeout) it matters most.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: bind-e2e-failure-pluto-0.20
          path: |
            ${{ runner.temp }}/bind-e2e-artifacts/
            test/e2e/pluto.log
          if-no-files-found: ignore
          retention-days: 14

  kind-sweep:
    # Required: the live-verification playbook (docs/dev/live-interaction-checklist.md) —
    # kind_sweep.mjs + polish_verify.mjs + keyboard_a11y.mjs on both backends — runs on every PR
    # and gates the merge. It ran advisorily until 60 consecutive CI runs showed no failure.
    name: Kind sweep (${{ matrix.backend }})
    needs: setup-lts
    runs-on: ubuntu-latest
    # kind_sweep.mjs's own mount deadline is 25min, polish_verify.mjs's is 15min, keyboard_a11y.mjs's
    # is also 25min — well over an hour of driver budget alone before checkout/playwright-install/
    # cold-instantiate, and the run deliberately keeps going after an earlier script fails (every
    # deadline can burn).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [cairo, webgl]
    steps:
      - uses: actions/checkout@v4
      # Julia 1.10, the compat floor, same as the WebGL extension tests — a flake here should be
      # attributable to the sweep, not to running a different Julia than the rest of the WGL gate.
      - uses: ./.github/actions/julia-env
        with:
          julia-version: ${{ needs.setup-lts.outputs.julia-version }}
          key: ${{ needs.setup-lts.outputs.key }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e/package.json') }}
      - name: Install Playwright + Chromium
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      # A self-contained :webgl widget page (no Pluto): click scatter marker 0 in Chromium, assert
      # the overlay emits the right bond value, then feed that exact emission through
      # transform_value.
      - name: WebGL widget page click
        if: matrix.backend == 'webgl'
        run: |
          julia --color=yes test/e2e/make_page.jl "$RUNNER_TEMP/e2e"
          (cd test/e2e && node click.mjs "$RUNNER_TEMP/e2e")
          julia --color=yes test/e2e/verify_capture.jl "$RUNNER_TEMP/e2e"
      # A WebGL widget outside Pluto fetches WGLMakie's script from Makie's release tag; the
      # driver serves the installed copy at those URLs (#300).
      - name: WebGL page outside Pluto
        if: matrix.backend == 'webgl'
        run: |
          julia --color=yes --project="$MASQUE_DEV_ENV" test/e2e/standalone_webgl.jl "$RUNNER_TEMP/standalone-webgl"
          cd test/e2e && node standalone_webgl.mjs "$RUNNER_TEMP/standalone-webgl"
      - name: Kind sweep + polish verify
        working-directory: test/e2e
        env:
          # Carried over from the local playbook (docs/dev/live-interaction-checklist.md) for
          # parity; GitHub-hosted runners have no sysimage wrapper, so this is a no-op here.
          JULIA_NOSYSIMAGE: ${{ matrix.backend == 'webgl' && '1' || '' }}
        run: |
          NOTEBOOK="$GITHUB_WORKSPACE/test/e2e/kind_sweep_${{ matrix.backend }}.jl"
          ARTIFACTS="$RUNNER_TEMP/kind-sweep-artifacts"
          mkdir -p "$ARTIFACTS"
          julia serve.jl 1240 > pluto.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          up=
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:1240 || echo 000)
            [ "$code" = "200" ] && { up=1; break; }
            sleep 2
          done
          [ -n "$up" ] || { echo "::error::Pluto never came up on :1240 (${{ matrix.backend }})"; cat pluto.log; exit 1; }

          status=0
          node kind_sweep.mjs http://127.0.0.1:1240 "$NOTEBOOK" ${{ matrix.backend }} "$ARTIFACTS" || status=1
          node polish_verify.mjs http://127.0.0.1:1240 "$NOTEBOOK" ${{ matrix.backend }} "$ARTIFACTS" || status=1
          node keyboard_a11y.mjs http://127.0.0.1:1240 "$NOTEBOOK" ${{ matrix.backend }} "$ARTIFACTS" || status=1
          exit $status
      - name: Pluto server log (${{ matrix.backend }})
        if: always()
        working-directory: test/e2e
        run: tail -n 200 pluto.log || true
      - name: Upload artifacts (${{ matrix.backend }})
        # always(), not failure(): a job-level timeout-minutes kill marks the running step
        # cancelled, not failed, so failure() alone would silently skip the upload on the one
        # occasion (a genuine timeout) it matters most (see PR #67's bind-e2e-failure upload for
        # the same reasoning). if-no-files-found: ignore keeps a passing run's upload a no-op
        # beyond pluto.log, which is itself useful wall-time evidence.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-sweep-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/kind-sweep-artifacts/
            test/e2e/pluto.log
          if-no-files-found: ignore
          retention-days: 14

  examples:
    name: Fixture notebooks
    needs: setup
    runs-on: ubuntu-latest
    # ci_run.jl heartbeats while a notebook runs and fails it at MASQUE_NOTEBOOK_TIMEOUT_S.
    # This job timeout is only the backstop.
    timeout-minutes: 40
    env:
      MASQUE_NOTEBOOK_TIMEOUT_S: "1200"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/julia-env
        with:
          julia-version: ${{ needs.setup.outputs.julia-version }}
          key: ${{ needs.setup.outputs.key }}
      # Deadline and heartbeat, no Pluto. Catches a waiter regression before the
      # notebooks themselves run.
      - name: Fixture runner wait loop
        run: julia test/notebooks/ci_run_tests.jl
      # Runs every Pluto notebook under test/notebooks headlessly; fails if any cell errors,
      # so a fixture can never silently drift out of sync with the API.
      - name: Run fixture notebooks headlessly
        run: julia --color=yes test/notebooks/ci_run.jl

  lint:
    # Formatting, the frontend gate and the docs link check: each takes under a minute, so they
    # share one runner. `!cancelled()` runs each gate even when an earlier one failed, so one red
    # run reports all of them.
    name: Lint (Runic, frontend, docs links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Runic formatting
        uses: fredrikekre/runic-action@v1
        with:
          version: '1'
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: '20'
      # docs/dev/check_docs_links.mjs verifies every link into docs/dev/ (file existence +
      # heading anchor). No npm dependency (the slugger is vendored in the script).
      - name: Docs links
        if: ${{ !cancelled() }}
        run: node docs/dev/check_docs_links.mjs
      - name: Frontend install
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend tests
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run test:coverage
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Frontend build
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run build

      # PRs (incl. forks, which can't push): fail if either committed bundle is stale.
      - name: Verify committed bundles are up to date
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- assets/overlay.js assets/masque-webgl.js; then
            echo "::error::frontend assets are out of date — run 'cd frontend && npm run build' and commit."
            git --no-pager diff --stat -- assets/overlay.js assets/masque-webgl.js
            exit 1
          fi

      # Push to main: CI owns both bundles — commit whichever rebuilt so main is never stale.
      - name: Commit rebuilt bundles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- assets/overlay.js assets/masque-webgl.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/overlay.js assets/masque-webgl.js
            git commit -m "ci: rebuild frontend assets [skip ci]"
            git pull --rebase origin main   # serialize with a second push landing on main mid-run
            git push
          fi
