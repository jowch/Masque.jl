name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        description: "[DEPRECATED] No longer has any effect"
        default: "3"
# TagBot pushes the version tag, creates the GitHub release, reads merged PRs for the changelog,
# and, when it cannot release, opens an issue for manual intervention. This repo's default token
# is read-only, so without this block v0.1.0's run got a 403 on the tag push and on opening that
# issue. TagBot's README advises no block at all, which works only with a read-write default; a
# block must list every scope it uses, since unlisted ones become `none`. A commit that changes a
# workflow file still cannot be tagged with GITHUB_TOKEN: the `ssh` key below covers that.
permissions:
  contents: write
  issues: write
  pull-requests: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    # ubuntu-slim doesn't support containers, and thus won't work
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@cded32665b34ca0496d3ac10a67d08ddfc726963 # v1.25.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # For commits that modify workflow files: GITHUB_TOKEN cannot push the
          # tag or GitHub Release. SSH lets TagBot tag those SHAs; the Release
          # may still need TagBot's auto-opened manual-release issue.
          # See: https://github.com/JuliaRegistries/TagBot#commits-that-modify-workflow-files
          ssh: ${{ secrets.DOCUMENTER_KEY }}
