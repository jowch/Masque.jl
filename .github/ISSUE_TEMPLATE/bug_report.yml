name: Bug report
description: Something in a Masque plot does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code to reproduce it
      description: The smallest notebook cells that show the problem, ready to paste into Pluto.
      render: julia
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - CairoMakie
        - WGLMakie (backend = :webgl)
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste the output of `import Pkg; Pkg.status()` from the notebook, plus your Julia version and browser.
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error messages, browser console output, or a screenshot.
