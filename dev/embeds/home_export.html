<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NYC borough choropleth, overlay-only hover</title>
  <script>
{
  function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
  try { if (isDocDark()) document.documentElement.classList.add("pluto-dark"); } catch (e) {}
}
</script>

  <style>
:root {
  --pluto-cell-spacing: 17px;
  --pluto-operator-ligatures: none;
  --julia-mono-font-stack: JuliaMono, Menlo, "Roboto Mono", "Lucida Sans Typewriter", "Source Code Pro", monospace;
  --lato-ui-font-stack: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Cantarell, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", system-ui, sans-serif;
  --custom-code-font-stack: "";
  --code-font-stack: var(--julia-mono-font-stack);
}
html:not(.pluto-dark) { color-scheme: light; }
html.pluto-dark { color-scheme: dark; }
html { font-size: 16px; }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  overflow: hidden;
  background-color: var(--main-bg-color);
  color: var(--pluto-output-color);
  font-family: var(--lato-ui-font-stack);
}
body { position: relative; padding: 2.25rem 0; }
pluto-notebook {
  display: block;
  overflow: hidden;
  background: var(--main-bg-color);
  --code-font-stack: var(--custom-code-font-stack), var(--julia-mono-font-stack);
  padding-left: 25px;
  padding-right: 6px;
}
pluto-output {
  font-family: "Alegreya Sans", "Trebuchet MS", sans-serif;
  font-size: 14.5px;
  font-weight: 400;
  color: var(--pluto-output-color);
  display: block;
  padding-left: 10px;
  padding-right: 10px;
  align-items: baseline;
  overflow: hidden;
  background-color: var(--pluto-output-bg-color);
}
pluto-output pre {
  display: inline-block;
  margin: 0px;
  white-space: pre-wrap;
  word-break: break-all;
  tab-size: 4;
  font-family: var(--julia-mono-font-stack);
  font-size: 0.8rem;
  font-variant-ligatures: none;
}
pluto-cell {
  display: block;
  min-height: calc(23px + 1px + 1px);
  margin-top: var(--pluto-cell-spacing);
  position: relative;
}
pluto-cell:first-child { margin-top: 0; }
pluto-output:not(.rich_output) {
  display: flex;
  flex-wrap: wrap;
  padding-top: 3px;
  padding-bottom: 3px;
}
pluto-output > assignee {
  font-family: var(--julia-mono-font-stack);
  font-size: 0.75rem;
  font-variant-ligatures: none;
  color: var(--cm-color-variable) !important;
  font-weight: 700;
}
pluto-output > assignee::after {
  content: "\a0=\a0";
  opacity: 0.6;
}
pluto-output > assignee:empty { display: none; }
pluto-output > div {
  flex-shrink: 0;
  overflow-y: hidden;
}
pluto-trafficlight {
  box-sizing: content-box;
  width: 4px;
  position: absolute;
  left: -4px;
  top: 0px;
  bottom: 0px;
  pointer-events: none;
  border-top-left-radius: 4px;
  border-bottom-left-radius: 4px;
  border-left-color: var(--normal-cell-color);
  background: var(--normal-cell-color);
  overflow: hidden;
}
.ip-host { isolation: isolate; max-width: 100%; }
.masque-sim-chip {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 20;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px 4px 6px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 28%, transparent);
  background: transparent;
  color: var(--pluto-output-color);
  font-family: var(--lato-ui-font-stack);
  font-size: 0.72rem;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.01em;
  cursor: help;
  user-select: none;
}
.masque-sim-chip-icon {
  width: 13px;
  height: 13px;
  flex: 0 0 auto;
}
.masque-sim-chip-label code {
  font-family: var(--julia-mono-font-stack);
  font-size: 0.92em;
  font-weight: 600;
}
.masque-sim-tip {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: max-content;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 22%, transparent);
  background: var(--pluto-output-bg-color);
  color: var(--pluto-output-color);
  box-shadow: 0 6px 18px color-mix(in srgb, #000 16%, transparent);
  font-size: 0.72rem;
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: 0;
  text-align: left;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-2px);
  transition: opacity 80ms ease, visibility 80ms ease, transform 80ms ease;
}
.masque-sim-chip:hover .masque-sim-tip,
.masque-sim-chip:focus-visible .masque-sim-tip {
  opacity: 1;
  visibility: visible;
  transform: none;
}
pluto-input {
  display: block;
  position: relative;
}
/* Unfolded source stands in for Pluto's CodeMirror box: same border, same token colors. */
pre.masque-src {
  display: block;
  margin: 0;
  padding: 2px 6px 2px 4px;
  overflow-x: auto;
  white-space: pre;
  tab-size: 4;
  font-family: var(--code-font-stack);
  font-size: 15px;
  line-height: 1.45;
  font-variant-ligatures: none;
  background: transparent;
  color: var(--cm-color-editor-text);
  border: 1px solid var(--normal-cell-color);
  border-left: none;
  border-bottom-right-radius: 4px;
  min-height: 25px;
}
/* Same mapping as Pluto frontend/highlightjs.css: token classes onto the editor palette. */
pre.masque-src .hljs-keyword { color: var(--cm-color-keyword); }
pre.masque-src .hljs-built_in,
pre.masque-src .hljs-type { color: var(--cm-color-builtin); }
pre.masque-src .hljs-literal,
pre.masque-src .hljs-number { color: var(--cm-color-literal); }
pre.masque-src .hljs-string { color: var(--cm-color-string); }
pre.masque-src .hljs-symbol { color: var(--cm-color-symbol); }
pre.masque-src .hljs-comment { color: var(--cm-color-comment); }
pre.masque-src .hljs-meta { color: var(--cm-color-macro); font-weight: 700; }
pluto-cell.masque-note pluto-output {
  font-family: var(--lato-ui-font-stack);
  font-size: 15px;
  padding-top: 0;
  padding-bottom: 0;
}
pluto-cell.masque-note pluto-output p {
  margin: 0.4em 0;
}

        --pluto-logs-key-color: rgba(255, 255, 255, 0.6);
        --pluto-logs-progress-fill: #5f7f5b;
        --pluto-logs-progress-bg: #3d3d3d;
        --pluto-logs-progress-border: hsl(210deg 35% 72%);
        --pluto-logs-info-color: #484848;
        --pluto-logs-info-accent-color: inherit;
        --pluto-logs-warn-color: rgb(80 76 38);
        --pluto-logs-warn-accent-color: rgb(239 231 135);
        --pluto-logs-danger-color: rgb(100 47 39);
        --pluto-logs-danger-accent-color: rgb(255 147 132);
        --pluto-logs-debug-color: hsl(288deg 19% 25%);
        --pluto-logs-debug-accent-color: hsl(283deg 56% 79%);

        /*Top navbar styling*/
        --nav-h1-text-color: white;
        --nav-filepicker-color: #b6b6b6;
        --nav-filepicker-border-color: #c7c7c7;
        --nav-filepicker-suggest-color: rgba(107, 125, 140, 0.796);
        --nav-process-status-bg-color: rgb(82, 82, 82);
        --nav-process-status-color: var(--pluto-output-h-color);

        /*header*/
        --restart-recc-header-color: rgb(44 106 157 / 56%);
        --restart-recc-accent-color: rgb(44 106 157);
        --restart-req-header-color: rgb(145 66 60 / 56%);
        --dead-process-header-color: rgba(250, 75, 21, 0.473);
        --loading-header-color: hsl(0deg 0% 20% / 50%);
        --disconnected-header-color: rgba(255, 169, 114, 0.56);
        --binder-loading-header-color: hsl(51deg 64% 90% / 50%);

        /*loading bar*/
        --loading-grad-color-1: #a9d4f1;
        --loading-grad-color-2: #d0d4d7;

        /*saveall container*/
        --overlay-button-bg: #2c2c2c;
        --overlay-button-border: #9e9e9e70;
        --overlay-button-border-save: #c7a74670;
        --overlay-button-color: white;

        /*input_context_menu*/
        --input-context-menu-border-color: rgba(255, 255, 255, 0.1);
        --input-context-menu-bg-color: rgb(39, 40, 47);
        --input-context-menu-soon-color: #b1b1b144;
        --input-context-menu-hover-bg-color: rgba(255, 255, 255, 0.1);
        --input-context-menu-li-color: #c7c7c7;

        /* ai features */
        --ai-gradient-bg: linear-gradient(20deg, #371d43, #613c35);
        --ai-prompt-bg: #3a3a3a;

        /*Pkg status*/
        --pkg-popup-bg: #3d2f44;
        --pkg-popup-border-color: #574f56;
        --pkg-popup-buttons-bg-color: var(--input-context-menu-bg-color);
        --pkg-version-color: #bbb;
        --black: white;
        --white: black;
        --pkg-terminal-bg-color: #252627;
        --pkg-terminal-border-color: #c3c3c388;

        /* run area*/
        --pluto-runarea-bg-color: rgb(43, 43, 43);
        --pluto-runarea-span-color: hsl(353, 5%, 64%);

        /*drop ruler*/
        --dropruler-bg-color: rgba(255, 255, 255, 0.1);

        /* jlerror */
        --jlerror-header-color: #d9baba;
        --jlerror-mark-bg-color: rgb(0 0 0 / 18%);
        --jlerror-a-bg-color: hsl(65.82deg 17.14% 27.45%);
        --jlerror-a-border-left-color: hsl(66 27% 35% / 1);
        --jlerror-mark-color: #b1a9a9;

        /* helpbox */
        --helpbox-bg-color: rgb(30 34 31);
        --helpbox-box-shadow-color: #00000017;
        --helpbox-header-bg-color: #2c3e36;
        --helpbox-header-tab-bg-color: #554e4e;
        --helpbox-header-color: rgb(255 248 235);
        --helpbox-search-bg-color: #2c2c2c;
        --helpbox-search-border-color: #757575;
        --helpbox-notfound-search-color: rgb(139, 139, 139);
        --helpbox-text-color: rgb(230, 230, 230);
        --code-section-bg-color: rgb(44, 44, 44);
        --code-section-border-color: #555a64;
        --process-item-bg: #443d44;
        --process-busy: #ffcd70;
        --process-finished: hsl(126deg 30% 60%);
        --process-undefined: rgb(151, 151, 151);
        --process-failed: hsl(4, 30%, 60%);
        --process-notify-bg: hsl(0 0% 21%);

        /*footer*/
        --footer-color: #cacaca;
        --footer-bg-color: var(--header-bg-color);
        --footer-atag-color: rgb(114, 161, 223);
        --footer-input-border-color: #6c6c6c;
        --footer-filepicker-button-color: black;
        --footer-filepicker-focus-color: #c1c1c1;
        --footnote-border-color: rgba(114, 225, 231, 0.15);
        --settings-bg-color: rgb(30 34 31);
        --settings-p2-color: #898989;
        --settings-header-bg-color: #f9dadf;

        /* undo delete cell*/
        --undo-delete-box-shadow-color: rgb(0 0 0 / 6%);

        /*codemirror hints*/
        --cm-color-editor-tooltip-border: rgba(0, 0, 0, 0.2);
        --cm-color-editor-li-aria-selected-bg: #3271e7;
        --cm-color-editor-li-aria-selected: white;
        --cm-color-editor-li-notexported: rgba(255, 255, 255, 0.5);
        --code-background: hsl(222deg 16% 19%);
        --cm-color-code-differs-gutters: rgb(235 213 28 / 11%);
        --cm-color-line-numbers: #8d86875e;
        --cm-selection-background: hsl(215deg 64% 59% / 48%);
        --cm-selection-background-blurred: hsl(215deg 0% 59% / 48%);
        --cm-highlighted: #cbceb629;

        /* code highlighting */
        --cm-color-editor-text: oklch(90% 3% 0deg);
        --cm-color-comment: oklch(80% 30% 0deg);
        --cm-color-keyword: oklch(70% 40% 30deg);
        --cm-color-definition: oklch(72.266% 0.04982 26.319);
        --cm-color-control-operator: oklch(0.72 0.19 353.17);
        --cm-color-symbol: oklch(80% 30% 60deg);
        --cm-color-macro: oklch(80% 30% 150deg);
        --cm-color-command: oklch(80% 10% 120deg);
        --cm-color-string: oklch(80% 10% 180deg);
        --cm-color-variable: oklch(80% 10% 270deg);
        --cm-color-typedef-shadow: oklch(0.44 0.11 63.6);
        --cm-color-literal: oklch(80% 30% 330deg);
        --cm-filter-type: brightness(80%) saturate(80%);
        --cm-color-builtin: #5e7ad3;
        --cm-color-function: #f99b15;
        --cm-color-link: #815ba4;
        --cm-color-bracket: #b8ab87;
        --cm-color-matchingBracket: white;
        --cm-color-matchingBracket-bg: #c58c237a;
        --cm-color-placeholder-text: rgb(255 255 255 / 20%);
        --cm-color-clickable-underline: #5d5f70;

        /* Mixed parsers */
        --cm-color-html: #00ab85;
        --cm-color-html-accent: #00e7b4;
        --cm-color-css: #ebd073;
        --cm-color-css-accent: #fffed2;
        --cm-css-why-doesnt-codemirror-highlight-all-the-text-aaa: #ffffea;
        --cm-color-md: #a2c9d5;
        --cm-color-md-accent: #00a9d1;

        /*autocomplete menu*/
        --autocomplete-menu-bg-color: var(--input-context-menu-bg-color);

        /* Landing colors */
        --index-text-color: rgb(199, 199, 199);
        --index-light-text-color: rgb(199, 199, 199);
        --index-clickable-text-color: rgb(235, 235, 235);
        --docs-binding-bg: #323431;
        --index-card-bg: #313131;
        --welcome-mywork-bg: var(--header-bg-color);
        --welcome-newnotebook-bg: rgb(68 72 102);
        --welcome-recentnotebook-bg: #3b3b3b;
        --welcome-recentnotebook-border: #6e6e6e;
        --welcome-open-bg: hsl(233deg 20% 33%);
        --welcome-card-author-backdrop: #0000006b;

        /* confirm-before-long-runtime dialog */
        --confirm-runtime-bg: linear-gradient(180deg, hsl(0 0% 19% / 1), hsl(243 14% 23% / 1));
        --confirm-runtime-bonus-bg: hsl(0deg 0% 12.85%);
        --confirm-runtime-bonus-border: #636363;
        --confirm-runtime-button-bg: #3a3a3a;
        --confirm-runtime-button-border: #5a5a5a;
        --confirm-runtime-yes-bg: #ddd1d6;
        --confirm-runtime-yes-color: #000;
        --confirm-runtime-yes-border: #9f9f9f;
        --confirm-runtime-yes-progress: linear-gradient(90deg, #f0f0f0, #9a9a9a);
    }

    @media (prefers-contrast: more) {
        html.pluto-dark {
            --cm-color-line-numbers: #b3b3b3;
        }
    }
  </style>
</head>
