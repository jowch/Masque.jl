<!DOCTYPE html><html><head>
<!-- masque-pluto-export -->
<script>
function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
(function () {
  var framed = window.parent && window.parent !== window;
  var dark = false;
  if (framed) {
    try { dark = isDocDark(); } catch (e) { dark = false; }
  } else if (window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.classList.toggle("pluto-dark", dark);
  if (framed && window.matchMedia) {
    var native = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var s = String(q);
      if (s.indexOf("prefers-color-scheme") === -1) return native(q);
      var wantsDark = s.indexOf("dark") !== -1;
      var matches = wantsDark ? dark : !dark;
      return {
        matches: matches,
        media: s,
        onchange: null,
        addListener: function () {},
        removeListener: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        dispatchEvent: function () { return false; },
      };
    };
  }
})();

  if (Array.isArray(v.items)) return "items:" + v.items.map(itemKey).join(",");
  if (v.layer != null && v.index != null && v.index !== "") {
    return layerIndexKey(v.layer, v.index);
  }
  return JSON.stringify(v);
}
function brushParts(key) {
  const body = key.slice("items:".length);
  return body ? body.split(",") : [];
}
function windowOf(part) {
  const m = /^(.*)@(\d+)-(\d+)\/(\d+)-(\d+)$/.exec(part);
  return m ? { layer: m[1], i0: +m[2], i1: +m[3], j0: +m[4], j1: +m[5] } : null;
}
function brushOverlap(a, b) {
  if (a.length === 1 && b.length === 1) {
    const wa = windowOf(a[0]), wb = windowOf(b[0]);
    if (wa && wb) {
      if (wa.layer !== wb.layer) return 0;
      const iw = Math.min(wa.i1, wb.i1) - Math.max(wa.i0, wb.i0) + 1;
      const jw = Math.min(wa.j1, wb.j1) - Math.max(wa.j0, wb.j0) + 1;
      const inter = iw > 0 && jw > 0 ? iw * jw : 0;
      const area = function (w) { return (w.i1 - w.i0 + 1) * (w.j1 - w.j0 + 1); };
      return inter / (area(wa) + area(wb) - inter);
    }
  }
  if (!a.length || !b.length) return 0;
  const sa = new Set(a);
  let inter = 0;
  b.forEach(function (x) { if (sa.has(x)) inter++; });
  return inter / (sa.size + b.length - inter);
}
function lookup(table, v) {
  const keys = [keyOf(v)];
  if (v && v.layer != null && v.index != null && v.index !== "") {
    keys.push(String(v.layer) + ":" + String(v.index));
    keys.push(String(v.layer) + ":" + String(v.index | 0));
  }
  for (let i = 0; i < keys.length; i++) {
    if (Object.prototype.hasOwnProperty.call(table.keys, keys[i])) {
      return { snap: table.snaps[table.keys[keys[i]]], approx: false };
    }
  }
  if (!v || !Array.isArray(v.items)) return null;
  const mine = brushParts(keys[0]);
  let best = null, bestScore = 0;
  Object.keys(table.keys).forEach(function (k) {
    if (k.indexOf("items:") !== 0) return;
    const score = brushOverlap(mine, brushParts(k));
    if (score > bestScore) { best = k; bestScore = score; }
  });
  if (!best || bestScore < NEAREST_MIN) return null;
  return { snap: table.snaps[table.keys[best]], approx: true };
}
function showApprox(approx) {
  const label = document.querySelector(".masque-sim-chip-label");
  const tip = document.getElementById("masque-sim-tip");
  if (!label) return;
  label.innerHTML = approx ? "Nearest recorded brush" : "Simulating <code>@bind</code>";
  if (tip) {
    tip.textContent = approx
      ? "No snapshot for this exact box; showing the recorded brush that overlaps it most."
      : "Precomputed snapshots, not a live Julia process.";
  }
}

  function sizeFrame() {
    if (!window.frameElement) return;
    const nb = document.querySelector("pluto-notebook");
    const bottom = nb ? nb.getBoundingClientRect().bottom : document.documentElement.scrollHeight;
    window.frameElement.style.height = Math.max(1, Math.ceil(bottom + 8)) + "px";
  }
  let stamp = Date.now();
  function nextStamp() {
    stamp = Math.max(Date.now(), stamp + 1);
    return stamp;
  }
  function patch(v) {
    if (!window.editor_state_set) return;
    const hit = lookup(TABLE, v);
    if (!hit) {
      console.warn("masque player: no snapshot for", keyOf(v));
      return;
    }
    showApprox(hit.approx);
    const snap = hit.snap;
    const t = nextStamp();
    window.editor_state_set(function (state) {
      const nb = state.notebook;
      const cell_results = Object.assign({}, nb.cell_results);
      Object.keys(snap.cells).forEach(function (id) {
        const prev = cell_results[id];
        if (!prev || !prev.output) return;
        const next = snap.cells[id];
        cell_results[id] = Object.assign({}, prev, {
          output: Object.assign({}, prev.output, {
            body: next.body,
            mime: next.mime,
            last_run_timestamp: t,
            persist_js_state: false,
          }),
        });
      });
      return { notebook: Object.assign({}, nb, { cell_results: cell_results }) };
    }).then(sizeFrame);
  }
  let armed = null;
  function tryArm() {
    const cell = document.getElementById(WIDGET_ID);
    const host = cell && cell.querySelector(".ip-host");
    if (!host || typeof window.editor_state_set !== "function") return false;
    if (armed === host) return true;
    armed = host;
    let cur = host.value;
    Object.defineProperty(host, "value", {
      configurable: true,
      enumerable: true,
      get: function () { return cur; },
      set: function (v) {
        cur = v;
        patch(v);
      },
    });
    host.addEventListener("input", function () { patch(host.value); });
    return true;
  }
  function boot() {
    if (!tryArm()) {
      setTimeout(boot, 80);
      return;
    }
    sizeFrame();
  }
  boot();
  window.addEventListener("load", sizeFrame);
  new ResizeObserver(sizeFrame).observe(document.documentElement);
}
