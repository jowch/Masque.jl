header#pluto-nav,
footer,
pluto-runarea,
pluto-shoulder,
pluto-cell > button,
#helpbox-wrapper,
.floating_back_button,

#binder_spinners,

body > div:not(.masque-bar):not(.masque-miss) {
  min-height: 0 !important;

}
pluto-editor,

  min-height: 0 !important;

  margin-top: 0 !important;
  padding-top: 10px !important;

}

}
.masque-bar {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 6px;
}
.masque-download,

  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px 4px 6px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 28%, transparent);

  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.01em;
  cursor: help;
  user-select: none;
}
.masque-download {
  cursor: pointer;
  text-decoration: none;
}
.masque-download:hover,
.masque-download:focus-visible {
  border-color: color-mix(in srgb, var(--pluto-output-color) 55%, transparent);
}
.masque-miss {
  margin: 0 8px 10px 25px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 28%, transparent);
  background: var(--pluto-output-bg-color, var(--main-bg-color));
  color: var(--pluto-output-color);
  font-family: var(--lato-ui-font-stack, system-ui, sans-serif);
  font-size: 0.8rem;
  line-height: 1.35;
}
.masque-miss[hidden] { display: none; }
.masque-miss a { color: inherit; }
.masque-sim-chip-icon { width: 13px; height: 13px; flex: 0 0 auto; }
.masque-sim-chip-label code {
  font-family: var(--julia-mono-font-stack, ui-monospace, monospace);
  font-size: 0.92em;
  font-weight: 600;
}
.masque-sim-tip {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: max-content;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 22%, transparent);
  background: var(--pluto-output-bg-color, var(--main-bg-color));
  color: var(--pluto-output-color);
  box-shadow: 0 6px 18px color-mix(in srgb, #000 16%, transparent);
  font-size: 0.72rem;
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: 0;
  text-align: left;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.masque-sim-chip:hover .masque-sim-tip,
.masque-sim-chip:focus-visible .masque-sim-tip {
  opacity: 1;
  visibility: visible;
}

  function layerIndexKey(layer, index) {

// A field keys the same as its starting value when it shows the same thing: a box released

function changed(table, v) {
