<!DOCTYPE html><html><head>
<!-- masque-pluto-export -->
<script>
function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
(function () {
  var framed = window.parent && window.parent !== window;
  var dark = false;
  if (framed) {
    try { dark = isDocDark(); } catch (e) { dark = false; }
  } else if (window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.classList.toggle("pluto-dark", dark);
  if (framed && window.matchMedia) {
    var native = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var s = String(q);
      if (s.indexOf("prefers-color-scheme") === -1) return native(q);
      var wantsDark = s.indexOf("dark") !== -1;
      var matches = wantsDark ? dark : !dark;
      return {
        matches: matches,
        media: s,
        onchange: null,
        addListener: function () {},
        removeListener: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        dispatchEvent: function () { return false; },
      };
    };
  }
})();

<script>
{
  const TABLE = {"keys":{"null":0},"snaps":[{"cells":{"5c1ce000-0001-4000-8000-000000000002":{"body":"","mime":"text/plain"},"5c1ce000-0001-4000-8000-000000000004":{"body":"\"click a wavelength\"","mime":"text/plain"},"5c1ce000-0001-4000-8000-000000000009":{"body":"\u003cdiv class=\"markdown\">\u003cp>Move the pointer across the plot. A vertical line follows it, a dot marks where it crosses each spectrum, and the tooltip lists each spectrum&#39;s absorbance at that wavelength.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000010":{"body":"\u003cdiv class=\"markdown\">\u003cp>Plot each spectrum with its own \u003ccode>lines&#33;\u003c/code> call. A \u003ccode>label\u003c/code> that starts with a letter and holds only letters, digits, and underscores names that spectrum&#39;s row in the tooltip.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000011":{"body":"\u003cdiv class=\"markdown\">\u003cp>Pass all three plots to one \u003ccode>SliceInteractable\u003c/code>, because \u003ccode>masque&#40;fig&#41;\u003c/code> does not add one on its own. The slice only shows values, so to keep a wavelength, add an \u003ccode>AxisInteractable\u003c/code> as well. \u003ccode>auto &#61; false\u003c/code> keeps the lines from taking the click, so a click saves a wavelength rather than a line.\u003c/p>\n\u003cp>In your own notebook, a click saves the position in \u003ccode>at\u003c/code>. This page does not record clicks, so only the hover works here.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000012":{"body":"\u003cdiv class=\"markdown\">\u003cp>\u003ccode>at\u003c/code> starts as \u003ccode>nothing\u003c/code>. After a click, \u003ccode>at.x\u003c/code> is the wavelength you clicked, and this cell reads each spectrum at the nearest measured wavelength.\u003c/p>\n\u003c/div>","mime":"text/html"}}}]};
  const WIDGET_ID = "5c1ce000-0001-4000-8000-000000000003";
  function layerIndexKey(layer, index) {
  return String(layer) + ":" + String(Number(index));
}
function itemKey(it) {
  const k = layerIndexKey(it.layer, it.index);
  const p = it.payload;
  if (!p || p.i0 == null) return k;
  return k + "@" + p.i0 + "-" + p.i1 + "/" + p.j0 + "-" + p.j1;
}
function keyOf(v) {
  if (v == null) return "null";
  if (Array.isArray(v.items)) return "items:" + v.items.map(itemKey).join(",");
  if (v.layer != null && v.index != null && v.index !== "") {
    return layerIndexKey(v.layer, v.index);
  }
  return JSON.stringify(v);
}
function lookup(table, v) {
  const keys = [keyOf(v)];
  if (v && v.layer != null && v.index != null && v.index !== "") {
    keys.push(String(v.layer) + ":" + String(v.index));
    keys.push(String(v.layer) + ":" + String(v.index | 0));
  }
  for (let i = 0; i < keys.length; i++) {
    if (Object.prototype.hasOwnProperty.call(table.keys, keys[i])) {
      return table.snaps[table.keys[keys[i]]];
    }
  }
  return null;
}

  function sizeFrame() {

    const nb = document.querySelector("pluto-notebook");

    window.frameElement.style.height = Math.max(1, Math.ceil(bottom + 8)) + "px";

    return stamp;
  }
  function patch(v) {
    if (!window.editor_state_set) return;
    const snap = lookup(TABLE, v);
    if (!snap) {
      console.warn("masque player: no snapshot for", keyOf(v));
      return;
    }
    const t = nextStamp();
    window.editor_state_set(function (state) {
      const nb = state.notebook;
      const cell_results = Object.assign({}, nb.cell_results);
      Object.keys(snap.cells).forEach(function (id) {

        if (!prev || !prev.output) return;
        const next = snap.cells[id];
        cell_results[id] = Object.assign({}, prev, {
          output: Object.assign({}, prev.output, {
            body: next.body,
            mime: next.mime,
            last_run_timestamp: t,
            persist_js_state: false,
          }),
        });
      });
      return { notebook: Object.assign({}, nb, { cell_results: cell_results }) };
    }).then(sizeFrame);
  }
  let armed = null;
  function tryArm() {
    const cell = document.getElementById(WIDGET_ID);
    const host = cell && cell.querySelector(".ip-host");
    if (!host || typeof window.editor_state_set !== "function") return false;
    if (armed === host) return true;
    armed = host;
    let cur = host.value;
    Object.defineProperty(host, "value", {
      configurable: true,
      enumerable: true,
      get: function () { return cur; },
      set: function (v) {
        cur = v;
        patch(v);
      },
    });
    host.addEventListener("input", function () { patch(host.value); });
    // A widget built with `selected=` starts with a value; the export shows the idle
    // (`nothing`) outputs, so swap in that value's snapshot now.
    if (cur != null) patch(cur);
    return true;
  }
  function boot() {
    if (!tryArm()) {
      setTimeout(boot, 80);
      return;
    }
    sizeFrame();
  }
  boot();
  window.addEventListener("load", sizeFrame);
  new ResizeObserver(sizeFrame).observe(document.documentElement);
