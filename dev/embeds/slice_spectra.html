<!DOCTYPE html><html><head>
<!-- masque-pluto-export -->
<script>
function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
(function () {
  var framed = window.parent && window.parent !== window;
  var dark = false;
  if (framed) {
    try { dark = isDocDark(); } catch (e) { dark = false; }
  } else if (window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.classList.toggle("pluto-dark", dark);
  if (framed && window.matchMedia) {
    var native = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var s = String(q);
      if (s.indexOf("prefers-color-scheme") === -1) return native(q);
      var wantsDark = s.indexOf("dark") !== -1;
      var matches = wantsDark ? dark : !dark;
      return {
        matches: matches,
        media: s,
        onchange: null,
        addListener: function () {},
        removeListener: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        dispatchEvent: function () { return false; },
      };
    };
  }
})();
</script>

{
  const TABLE = {"initial":{"axis":null},"keyed":["axis"],"keys":{"null":0},"snaps":[{"cells":{"5c1ce000-0001-4000-8000-000000000002":{"body":"","mime":"text/plain"},"5c1ce000-0001-4000-8000-000000000004":{"body":"\"click a wavelength\"","mime":"text/plain"},"5c1ce000-0001-4000-8000-000000000009":{"body":"\u003cdiv class=\"markdown\">\u003cp>Move the pointer across the plot. A vertical line follows it, a dot marks where it crosses each spectrum, and the tooltip lists each spectrum&#39;s absorbance at that wavelength.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000010":{"body":"\u003cdiv class=\"markdown\">\u003cp>Plot each spectrum with its own \u003ccode>lines&#33;\u003c/code> call. A \u003ccode>label\u003c/code> that starts with a letter and holds only letters, digits, and underscores names that spectrum&#39;s row in the tooltip.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000011":{"body":"\u003cdiv class=\"markdown\">\u003cp>Pass all three plots to one \u003ccode>SliceInteractable\u003c/code>, because \u003ccode>masque&#40;fig&#41;\u003c/code> does not add one on its own. The slice only shows values, so to keep a wavelength, add an \u003ccode>AxisInteractable\u003c/code> as well, and \u003ccode>bind &#61; readout\u003c/code> makes \u003ccode>at\u003c/code> its value. \u003ccode>auto &#61; false\u003c/code> leaves out what \u003ccode>masque&#40;fig&#41;\u003c/code> would add for the lines and the legend, so only the slice and the readout respond to the pointer.\u003c/p>\n\u003cp>In your own notebook, a click saves the position in \u003ccode>at\u003c/code>. This page does not record clicks, so only the hover works here.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000012":{"body":"\u003cdiv class=\"markdown\">\u003cp>\u003ccode>at\u003c/code> starts as \u003ccode>nothing\u003c/code>. After a click, \u003ccode>at.x\u003c/code> is the wavelength you clicked, and this cell reads each spectrum at the nearest measured wavelength.\u003c/p>\n\u003c/div>","mime":"text/html"}}}]};

function find(table, keys) {
  for (let i = 0; i < keys.length; i++) {
    if (Object.prototype.hasOwnProperty.call(table.keys, keys[i])) {
      return table.snaps[table.keys[keys[i]]];
    }
  }
  return null;
}
// A reader who clicks one plot and then another changes two fields, a value the harvest never
// recorded. Show the latest change on its own: the field that differs from the last value.
function lookup(table, v) {
  const prev = table.last_;
  table.last_ = v;
  let hit = find(table, keysFor(table, v));
  if (!hit && v != null && prev != null) {
    const moved = (table.keyed || []).filter(function (f) { return stable(v[f]) !== stable(prev[f]); });
    if (moved.length === 0) return table.shown_ || null;
    if (moved.length === 1) {
      const alone = Object.assign({}, table.initial || {});
      alone[moved[0]] = v[moved[0]];
      hit = find(table, keysFor(table, alone));
    }
  }
  if (hit) table.shown_ = hit;
  return hit;
}

  function sizeFrame() {
    if (!window.frameElement) return;
    const nb = document.querySelector("pluto-notebook");
    const bottom = nb ? nb.getBoundingClientRect().bottom : document.documentElement.scrollHeight;
    window.frameElement.style.height = Math.max(1, Math.ceil(bottom + 8)) + "px";
  }
  // The segments of one notebook share its value: the iframe showing the widget posts each
  // value to the page, and the page passes it to the notebook's other iframes
  // (`assets/masque-embed.js`), which patch their own cells.
  const framed = window.parent && window.parent !== window;
  const showsWidget = !window.masqueSegment || window.masqueSegment.indexOf(WIDGET_ID) !== -1;
  function announce(v) {
    if (framed && showsWidget) window.parent.postMessage({ masque: "bond", value: v }, "*");
  }
  let pending;
  let hasPending = false;
  window.addEventListener("message", function (e) {
    const d = e.data;
    if (e.source !== window.parent || !d || d.masque !== "bond-relay") return;
    if (armed) patch(d.value);
    else {
      pending = d.value;
      hasPending = true;
    }
  });
  let stamp = Date.now();
  function nextStamp() {
    stamp = Math.max(Date.now(), stamp + 1);
    return stamp;
  }
  function patch(v) {
    if (!window.editor_state_set) return;
    const snap = lookup(TABLE, v);
    if (!snap) {
      console.warn("masque player: no snapshot for", keyOf(TABLE, v));
      return;
    }
    const t = nextStamp();
    window.editor_state_set(function (state) {
      const nb = state.notebook;
      const cell_results = Object.assign({}, nb.cell_results);
      Object.keys(snap.cells).forEach(function (id) {
        const prev = cell_results[id];
        if (!prev || !prev.output) return;
        const next = snap.cells[id];
        cell_results[id] = Object.assign({}, prev, {
          output: Object.assign({}, prev.output, {
            body: next.body,
            mime: next.mime,
            last_run_timestamp: t,
            persist_js_state: false,
          }),
        });
      });
      return { notebook: Object.assign({}, nb, { cell_results: cell_results }) };
    }).then(sizeFrame);
  }
  let armed = null;
  function tryArm() {
    const cell = document.getElementById(WIDGET_ID);
    const host = cell && cell.querySelector(".ip-host");
    if (!host || typeof window.editor_state_set !== "function") return false;
    if (armed === host) return true;
    armed = host;
    let cur = host.value;
    Object.defineProperty(host, "value", {
      configurable: true,
      enumerable: true,
      get: function () { return cur; },
      set: function (v) {
        cur = v;
        patch(v);
        announce(v);
      },
    });
    host.addEventListener("input", function () {
      patch(host.value);
      announce(host.value);
    });
    // A widget built with `selected=` starts with a value; the export shows the idle
    // (`nothing`) outputs, so swap in that value's snapshot now.
    if (cur != null) patch(cur);
    if (hasPending) patch(pending);
    // Ask the page for a value another segment set before this one loaded.
    if (framed) window.parent.postMessage({ masque: "ready" }, "*");
    return true;
  }
  function boot() {
    if (!tryArm()) {
      setTimeout(boot, 80);
      return;
    }
    sizeFrame();
  }
  boot();
  window.addEventListener("load", sizeFrame);
  new ResizeObserver(sizeFrame).observe(document.documentElement);
}
