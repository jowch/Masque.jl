<!DOCTYPE html><html><head>
<!-- masque-pluto-export -->
<script>
function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
(function () {
  var framed = window.parent && window.parent !== window;
  var dark = false;
  if (framed) {
    try { dark = isDocDark(); } catch (e) { dark = false; }
  } else if (window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.classList.toggle("pluto-dark", dark);
  if (framed && window.matchMedia) {
    var native = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var s = String(q);
      if (s.indexOf("prefers-color-scheme") === -1) return native(q);
      var wantsDark = s.indexOf("dark") !== -1;
      var matches = wantsDark ? dark : !dark;
      return {
        matches: matches,
        media: s,
        onchange: null,
        addListener: function () {},
        removeListener: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        dispatchEvent: function () { return false; },
      };
    };
  }
})();

  const TABLE = {"initial":{"axis":null},"keyed":["axis"],"keys":{"null":0},"snaps":[{"cells":{"5c1ce000-0001-4000-8000-000000000002":{"body":"","mime":"text/plain"},"5c1ce000-0001-4000-8000-000000000004":{"body":"\"click a wavelength\"","mime":"text/plain"},"5c1ce000-0001-4000-8000-000000000009":{"body":"\u003cdiv class=\"markdown\">\u003cp>Move the pointer across the plot. A vertical line follows it, a dot marks where it crosses each spectrum, and the tooltip lists each spectrum&#39;s absorbance at that wavelength.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000010":{"body":"\u003cdiv class=\"markdown\">\u003cp>Plot each spectrum with its own \u003ccode>lines&#33;\u003c/code> call. A \u003ccode>label\u003c/code> that starts with a letter and holds only letters, digits, and underscores names that spectrum&#39;s row in the tooltip.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000011":{"body":"\u003cdiv class=\"markdown\">\u003cp>Pass all three plots to one \u003ccode>SliceInteractable\u003c/code>, because \u003ccode>masque&#40;fig&#41;\u003c/code> does not add one on its own. The slice only shows values, so to keep a wavelength, add an \u003ccode>AxisInteractable\u003c/code> as well, and \u003ccode>bind &#61; readout\u003c/code> makes \u003ccode>at\u003c/code> its value. \u003ccode>auto &#61; false\u003c/code> leaves out what \u003ccode>masque&#40;fig&#41;\u003c/code> would add for the lines and the legend, so only the slice and the readout respond to the pointer.\u003c/p>\n\u003cp>In your own notebook, a click saves the position in \u003ccode>at\u003c/code>. This page does not record clicks, so only the hover works here.\u003c/p>\n\u003c/div>","mime":"text/html"},"5c1ce000-0001-4000-8000-000000000012":{"body":"\u003cdiv class=\"markdown\">\u003cp>\u003ccode>at\u003c/code> starts as \u003ccode>nothing\u003c/code>. After a click, \u003ccode>at.x\u003c/code> is the wavelength you clicked, and this cell reads e   function layerIndexKey(layer, index) {
