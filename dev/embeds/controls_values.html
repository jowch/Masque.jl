function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
(function () {
  var framed = window.parent && window.parent !== window;
  var dark = false;
  if (framed) {
    try { dark = isDocDark(); } catch (e) { dark = false; }
  } else if (window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.classList.toggle("pluto-dark", dark);
  if (framed && window.matchMedia) {
    var native = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var s = String(q);
      if (s.indexOf("prefers-color-scheme") === -1) return native(q);
      var wantsDark = s.indexOf("dark") !== -1;
      var matches = wantsDark ? dark : !dark;
      return {
        matches: matches,
        media: s,
        onchange: null,
        addListener: function () {},
        removeListener: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        dispatchEvent: function () { return false; },
      };
    };
  }
})();
</script>

html, body {

.masque-bar {
  position: fixed;
  top: 8px;
  right: 8px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 6px;
}
.masque-download,
.masque-sim-chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px 4px 6px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 28%, transparent);

  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.01em;
  cursor: help;
  user-select: none;
}
.masque-download {
  cursor: pointer;
  text-decoration: none;
}
.masque-download:hover,
.masque-download:focus-visible {
  border-color: color-mix(in srgb, var(--pluto-output-color) 55%, transparent);
}
.masque-miss {
  margin: 0 8px 10px 25px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 28%, transparent);
  background: var(--pluto-output-bg-color, var(--main-bg-color));
  color: var(--pluto-output-color);
  font-family: var(--lato-ui-font-stack, system-ui, sans-serif);
  font-size: 0.8rem;
  line-height: 1.35;
}
.masque-miss[hidden] { display: none; }
.masque-miss a { color: inherit; }
.masque-sim-chip-icon { width: 13px; height: 13px; flex: 0 0 auto; }
.masque-sim-chip-label code {
  font-family: var(--julia-mono-font-stack, ui-monospace, monospace);
  font-size: 0.92em;
  font-weight: 600;
}
.masque-sim-tip {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: max-content;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 22%, transparent);
  background: var(--pluto-output-bg-color, var(--main-bg-color));
  color: var(--pluto-output-color);
  box-shadow: 0 6px 18px color-mix(in srgb, #000 16%, transparent);
  font-size: 0.72rem;
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: 0;
  text-align: left;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.masque-sim-chip:hover .masque-sim-tip,
.masque-sim-chip:focus-visible .masque-sim-tip {
  opacity: 1;
  visibility: visible;
}

<script>
{
  const TABLE = window.masquePlayer.table;
  const WIDGET_ID = "c0a10005-0001-4000-8000-000000000003";
  function layerIndexKey(layer, index) {
  return String(layer) + ":" + String(Number(index));
}
function pickKey(v) {
  const k = layerIndexKey(v.layer, v.index);
  return v.sample == null ? k : k + "@" + String(Number(v.sample));
}
function itemKey(it) {
  const k = pickKey(it);
  const p = it.payload;
  if (!p || p.i0 == null) return k;
  return k + "@" + p.i0 + "-" + p.i1 + "/" + p.j0 + "-" + p.j1;
}
function envKey(v) {
  if (v == null) return "null";
  if (Array.isArray(v.items)) return "items:" + v.items.map(itemKey).join(",");
  if (v.layer != null && v.index != null && v.index !== "") {
    return pickKey(v);
  }
  return JSON.stringify(v);
}
function stable(x) {
  if (x === undefined) x = null;
  if (x === null || typeof x !== "object") return JSON.stringify(x);
  if (Array.isArray(x)) return "[" + x.map(stable).join(",") + "]";
  return "{" + Object.keys(x).sort().map(function (k) { return JSON.stringify(k) + ":" + stable(x[k]); }).join(",") + "}";
}
// A field keys the same as its starting value when it shows the same thing: a box released
// where it started keeps its cells though its edges differ in the last float digit.
function changed(table, v) {
  const out = [];
  const init = table.initial || {};
  (table.keyed || []).forEach(function (f) {
    const cur = v[f] === undefined ? null : v[f];
    const start = init[f] === undefined ? null : init[f];
    if (stable(cur) !== stable(start) && fieldKey(table, f, cur) !== fieldKey(table, f, start)) out.push([f, cur]);
  });
  return out;
}
function fieldKey(table, f, cur) {
  if (cur == null) return "null@" + f;
  if ((table.controls || []).indexOf(f) !== -1) return f + "=" + JSON.stringify(cur.payload);
  return envKey(cur);
}
function keyOf(table, v) {
  if (v == null) return "null";
  const d = changed(table, v);
  if (!d.length) return "null";
  return d.map(function (p) { return fieldKey(table, p[0], p[1]); }).join("+");
}
function keysFor(table, v) {
  const keys = [keyOf(table, v)];
  const d = v == null ? [] : changed(table, v);
  const one = d.length === 1 ? d[0][1] : null;
  if (one && one.layer != null && one.index != null && one.index !== "") {
    keys.push(String(one.layer) + ":" + String(one.index));
    keys.push(String(one.layer) + ":" + String(one.index | 0));

}
function find(table, keys) {
  for (let i = 0; i < keys.length; i++) {

// Fetches each state file once and keeps it; a failed fetch is tried again next time.
function jsonFiles() {
  const loaded = new Map();

    if (!loaded.has(file)) {

        if (!r.ok) throw new Error(file + ": " + r.status);
        return r.json();

      }));

    return loaded.get(file);

// Shows each value's cells once its file loads, unless the reader reached a newer value first,
// a miss included: a slow file never lands over a newer value's cells or its note.
function latestOnly(load, apply, miss) {
  let latest = 0;
  return function (file) {
    const n = ++latest;
    miss(!file);
    if (!file) return;
    load(file).then(function (snap) {
      if (n === latest) apply(snap);
    }, function (e) {
      console.warn("masque player: snapshot", e);
      if (n === latest) miss(true);
    });

// A reader who clicks one plot and then another changes two fields, a value the harvest never

function lookup(table, v) {
  const prev = table.last_;
  table.last_ = v;
  let hit = find(table, keysFor(table, v));
  // A moved control changes what every other field's snapshot would show, so a value the
  // harvest skipped stays a miss rather than showing a snapshot taken at other settings.
  const controlMoved = v != null && changed(table, v).some(function (p) { return (table.controls || []).indexOf(p[0]) !== -1; });
  if (!hit && v != null && prev != null && !controlMoved) {
    const moved = (table.keyed || []).filter(function (f) { return stable(v[f]) !== stable(prev[f]); });
    if (moved.length === 0) return table.shown_ || null;
    if (moved.length === 1) {
      const alone = Object.assign({}, table.initial || {});
      alone[moved[0]] = v[moved[0]];
      hit = find(table, keysFor(table, alone));
    }
  }
  if (hit) table.shown_ = hit;
  return hit;
}

  // A value the harvest didn't record leaves the cells as they were, and says so in each part
  // that shows one of those cells. The widget's own part has the overlay's note for its picture.
  const miss = window.masqueSegment && !window.masqueSegment.some(function (id) { return id !== WIDGET_ID; })
    ? null : document.querySelector(".masque-miss");
  function showMiss(on) {
    if (!miss || miss.hidden === !on) return;
    miss.hidden = !on;
    sizeFrame();
  }
  // Until Pluto draws the notebook, the page is as tall as the iframe, so sizing then grew the
  // iframe a few px each frame. Keep the height the page reserved until the notebook and its
  // pictures are in.

    if (!window.frameElement) return;
    const nb = document.querySelector("pluto-notebook");
    if (!nb) return;
    const loading = Array.prototype.filter.call(nb.querySelectorAll("img"), function (img) {
      return !img.complete && img.offsetParent !== null;
    });
    if (loading.length) {
      loading.forEach(function (img) {
        img.addEventListener("load", sizeFrame, { once: true });
        img.addEventListener("error", sizeFrame, { once: true });

      return;

    if (miss && !miss.hidden) bottom = Math.max(bottom, miss.getBoundingClientRect().bottom);

  // value to the page, and the page passes it to the notebook's other iframes

  const showsWidget = !window.masqueSegment || window.masqueSegment.indexOf(WIDGET_ID) !== -1;

  }

  let hasPending = false;

    stamp = Math.max(Date.now(), stamp + 1);
    return stamp;
  }
  // Each state's cells are a file the page fetches the first time the reader reaches it.
  const load = jsonFiles();
  const show = latestOnly(load, apply, showMiss);
  function patch(v) {
    if (!window.editor_state_set) return;
    const file = lookup(TABLE, v);

    const t = nextStamp();
    window.editor_state_set(function (state) {
      const nb = state.notebook;
      const cell_results = Object.assign({}, nb.cell_results);
      Object.keys(snap.cells).forEach(function (id) {
        const prev = cell_results[id];
        if (!prev || !prev.output) return;
        const next = snap.cells[id];
        cell_results[id] = Object.assign({}, prev, {
          output: Object.assign({}, prev.output, {
            body: next.body,
            mime: next.mime,
            last_run_timestamp: t,
            persist_js_state: false,

  }

  function tryArm() {
    const cell = document.getElementById(WIDGET_ID);
    const host = cell && cell.querySelector(".ip-host");
    if (!host || typeof window.editor_state_set !== "function") return false;
    if (armed === host) return true;
    armed = host;
    let cur = host.value;
    Object.defineProperty(host, "value", {
      configurable: true,
      enumerable: true,
      get: function () { return cur; },
      set: function (v) {
        cur = v;
        patch(v);
        announce(v);
      },
    });
    host.addEventListener("input", function () {
      patch(host.value);
      announce(host.value);
    });
    // A widget built with `selected=` starts with a value; the export shows the idle
    // (`nothing`) outputs, so swap in that value's snapshot now.
    if (cur != null) patch(cur);
    if (hasPending) patch(pending);
    // Ask the page for a value another segment set before this one loaded.
    if (framed) window.parent.postMessage({ masque: "ready" }, "*");
    return true;
  }
  function boot() {
    if (!tryArm()) {
      setTimeout(boot, 80);
      return;
    }
    sizeFrame();
  }
  boot();
  window.addEventListener("load", sizeFrame);
  new ResizeObserver(sizeFrame).observe(document.documentElement);
}
