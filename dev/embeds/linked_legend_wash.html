<!DOCTYPE html><html><head>
<!-- masque-pluto-export -->
<script>
function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
(function () {
  var framed = window.parent && window.parent !== window;
  var dark = false;
  if (framed) {
    try { dark = isDocDark(); } catch (e) { dark = false; }
  } else if (window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.classList.toggle("pluto-dark", dark);
  if (framed && window.matchMedia) {
    var native = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var s = String(q);
      if (s.indexOf("prefers-color-scheme") === -1) return native(q);
      var wantsDark = s.indexOf("dark") !== -1;
      var matches = wantsDark ? dark : !dark;
      return {
        matches: matches,
        media: s,
        onchange: null,
        addListener: function () {},
        removeListener: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        dispatchEvent: function () { return false; },
      };
    };
  }
})();

  if (one && one.layer != null && one.index != null && one.index !== "") {
    keys.push(String(one.layer) + ":" + String(one.index));
    keys.push(String(one.layer) + ":" + String(one.index | 0));

}

// A reader who clicks one plot and then another changes two fields, a value the harvest never

function lookup(table, v) {

  if (!hit && v != null && prev != null) {
    const moved = (table.keyed || []).filter(function (f) { return stable(v[f]) !== stable(prev[f]); });
    if (moved.length === 0) return table.shown_ || null;
    if (moved.length === 1) {
      const alone = Object.assign({}, table.initial || {});
      alone[moved[0]] = v[moved[0]];
      hit = find(table, keysFor(table, alone));

}

  function sizeFrame() {
    if (!window.frameElement) return;
    const nb = document.querySelector("pluto-notebook");
    const bottom = nb ? nb.getBoundingClientRect().bottom : document.documentElement.scrollHeight;
    window.frameElement.style.height = Math.max(1, Math.ceil(bottom + 8)) + "px";
  }
  let stamp = Date.now();
  function nextStamp() {
    stamp = Math.max(Date.now(), stamp + 1);
    return stamp;
  }
  function patch(v) {
    if (!window.editor_state_set) return;
    const snap = lookup(TABLE, v);
    if (!snap) {
      console.warn("masque player: no snapshot for", keyOf(TABLE, v));
      return;
    }
    const t = nextStamp();
    window.editor_state_set(function (state) {
      const nb = state.notebook;
      const cell_results = Object.assign({}, nb.cell_results);
      Object.keys(snap.cells).forEach(function (id) {
        const prev = cell_results[id];
        if (!prev || !prev.output) return;
        const next = snap.cells[id];
        cell_results[id] = Object.assign({}, prev, {
          output: Object.assign({}, prev.output, {
            body: next.body,
            mime: next.mime,
            last_run_timestamp: t,
            persist_js_state: false,

  }
  let armed = null;
  function tryArm() {
    const cell = document.getElementById(WIDGET_ID);
    const host = cell && cell.querySelector(".ip-host");
    if (!host || typeof window.editor_state_set !== "function") return false;
    if (armed === host) return true;
    armed = host;
    let cur = host.value;
    Object.defineProperty(host, "value", {
      configurable: true,
      enumerable: true,
      get: function () { return cur; },
      set: function (v) {
        cur = v;
        patch(v);
      },
    });
    host.addEventListener("input", function () { patch(host.value); });
    // A widget built with `selected=` starts with a value; the export shows the idle
    // (`nothing`) outputs, so swap in that value's snapshot now.
    if (cur != null) patch(cur);
    return true;
  }
  function boot() {
    if (!tryArm()) {
      setTimeout(boot, 80);
      return;
    }
    sizeFrame();
  }
  boot();
  window.addEventListener("load", sizeFrame);
  new ResizeObserver(sizeFrame).observe(document.documentElement);
}
