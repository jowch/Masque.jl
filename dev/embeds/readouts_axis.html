<!DOCTYPE html><html><head>
<!-- masque-pluto-export -->
<script>
function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
(function () {
  var framed = window.parent && window.parent !== window;
  var dark = false;
  if (framed) {
    try { dark = isDocDark(); } catch (e) { dark = false; }
  } else if (window.matchMedia) {
    dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.classList.toggle("pluto-dark", dark);
  if (framed && window.matchMedia) {
    var native = window.matchMedia.bind(window);
    window.matchMedia = function (q) {
      var s = String(q);
      if (s.indexOf("prefers-color-scheme") === -1) return native(q);
      var wantsDark = s.indexOf("dark") !== -1;
      var matches = wantsDark ? dark : !dark;
      return {
        matches: matches,
        media: s,
        onchange: null,
        addListener: function () {},
        removeListener: function () {},
        addEventListener: function () {},
        removeEventListener: function () {},
        dispatchEvent: function () { return false; },
      };
    };
  }
})();

  const TABLE = {"initial":{"axis":null},"keyed":["axis"],"keys":{"null":0},"snaps":[{"cells":{"b18a0001-0001-4000-8000-000000000002":{"body":"","mime":"text/plain"},"b18a0001-0001-4000-8000-000000000009":{"body":"\u003cdiv class=\"markdown\">\u003cp>Move the pointer across the axis, and the tooltip follows it and shows the data coordinates \u003ccode>&#40;x, y&#41;\u003c/code>.\u003c/p>\n\u003c/div>","mime":"text/html"},"b18a0001-0001-4000-8000-000000000010":{"body":"\u003cdiv class=\"markdown\">\u003cp>Create the line plot the way you normally would, and add an \u003ccode>AxisInteractable\u003c/code> for its axis, because \u003ccode>masque&#40;fig&#41;\u003c/code> does not add one on its own.\u003c/p>\n\u003c/div>","mime":"text/html"},"b18a0001-0001-4000-8000-000000000011":{"body":"\u003cdiv class=\"markdown\">\u003cp>In your own notebook, \u003ccode>@bind pick\u003c/code> saves a click in \u003ccode>pick\u003c/code>, and \u003ccode>bind &#61; ints\u003c/code> makes \u003ccode>pick\u003c/code> the readout&#39;s value, with its position in \u003ccode>pick.x\u003c/code> and \u003ccode>pick.y\u003c/code>. This page does not record clicks, so only the tooltip works here.\u003c/p>\n\u003c/div>","mime":"text/html"}}}]};

  function layerIndexKey(layer, index) {
  return String(layer) + ":" + String(Number(index));
}
function pickKey(v) {
  const k = layerIndexKey(v.layer, v.index);
  return v.sample == null ? k : k + "@" + String(Number(v.sample));
}
function itemKey(it) {
  const k = pickKey(it);
  const p = it.payload;
  if (!p || p.i0 == null) return k;
  return k + "@" + p.i0 + "-" + p.i1 + "/" + p.j0 + "-" + p.j1;
}
function envKey(v) {
  if (v == null) return "null";
  if (Array.isArray(v.items)) return "items:" + v.items.map(itemKey).join(",");
  if (v.layer != null && v.index != null && v.index !== "") {
    return pickKey(v);
  }
  return JSON.stringify(v);
}
function stable(x) {
  if (x === undefined) x = null;
  if (x === null || typeof x !== "object") return JSON.stringify(x);
  if (Array.isArray(x)) return "[" + x.map(stable).join(",") + "]";
  return "{" + Object.keys(x).sort().map(function (k) { return JSON.stringify(k) + ":" + stable(x[k]); }).join(",") + "}";
}
function changed(table, v) {
  const out = [];
  const init = table.initial || {};
  (table.keyed || []).forEach(function (f) {
    const cur = v[f] === undefined ? null : v[f];
    if (stable(cur) !== stable(init[f])) out.push([f, cur]);

  return out;
}
function keyOf(table, v) {

  if (!d.length) return "null";
  return d.map(function (p) { return p[1] == null ? "null@" + p[0] : envKey(p[1]); }).join("+");
}
function keysFor(table, v) {
  const keys = [keyOf(table, v)];
  const d = v == null ? [] : changed(table, v);
  const one = d.length === 1 ? d[0][1] : null;
  if (one && one.layer != null && one.index != null && one.index !== "") {
    keys.push(String(one.layer) + ":" + String(one.index));

// A reader who clicks one plot and then another changes two fields, a value the harvest never
// recorded. Show the latest change on its own: the field that differs from the last value.
function lookup(table, v) {
  const prev = table.last_;
  table.last_ = v;
  let hit = find(table, keysFor(table, v));
  if (!hit && v != null && prev != null) {
    const moved = (table.keyed || []).filter(function (f) { return stable(v[f]) !== stable(prev[f]); });
    if (moved.length === 0) return table.shown_ || null;
    if (moved.length === 1) {
      const alone = Object.assign({}, table.initial || {});
      alone[moved[0]] = v[moved[0]];
      hit = find(table, keysFor(table, alone));
    }
  }
  if (hit) table.shown_ = hit;
  return hit;
}

      },
    });
    host.addEventListener("input", function () { patch(host.value); });
    // A widget built with `selected=` starts with a value; the export shows the idle
    // (`nothing`) outputs, so swap in that value's snapshot now.
    if (cur != null) patch(cur);
    return true;
  }
  function boot() {
    if (!tryArm()) {
      setTimeout(boot, 80);
      return;
    }
    sizeFrame();
  }
  boot();
  window.addEventListener("load", sizeFrame);
  new ResizeObserver(sizeFrame).observe(document.documentElement);
}
</script>
