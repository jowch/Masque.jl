  <script>
{
  function isDocDark() {
  var c = (window.parent && window.parent.document.documentElement.className) || "";
  if (!c) return false;
  if (/(^|\s)theme--(documenter-light|catppuccin-latte)(\s|$)/.test(c)) return false;
  return /(^|\s)theme--/.test(c);
}
  try { if (isDocDark()) document.documentElement.classList.add("pluto-dark"); } catch (e) {}
}
</script>

:root {

html, body {
  margin: 0;

  color: var(--pluto-output-color);
  font-family: var(--lato-ui-font-stack);

body { position: relative; padding: 2.25rem 0; }
pluto-notebook {

pluto-output {

  font-size: 14.5px;
  font-weight: 400;
  color: var(--pluto-output-color);

  padding-left: 10px;
  padding-right: 10px;
  align-items: baseline;
  overflow: hidden;
  background-color: var(--pluto-output-bg-color);
}
pluto-output pre {
  display: inline-block;
  margin: 0px;
  white-space: pre-wrap;
  word-break: break-all;
  tab-size: 4;
  font-family: var(--julia-mono-font-stack);
  font-size: 0.8rem;
  font-variant-ligatures: none;
}
pluto-cell {
  display: block;

  margin-top: var(--pluto-cell-spacing);
  position: relative;
}
pluto-cell:first-child { margin-top: 0; }
pluto-output:not(.rich_output) {

  flex-wrap: wrap;
  padding-top: 3px;
  padding-bottom: 3px;
}
pluto-output > assignee {
  font-family: var(--julia-mono-font-stack);
  font-size: 0.75rem;

}
pluto-output > assignee::after {
  content: "\a0=\a0";

pluto-output > assignee:empty { display: none; }
pluto-output > div {

pluto-trafficlight {
  box-sizing: content-box;
  width: 4px;
  position: absolute;
  left: -4px;
  top: 0px;
  bottom: 0px;
  pointer-events: none;
  border-top-left-radius: 4px;
  border-bottom-left-radius: 4px;
  border-left-color: var(--normal-cell-color);
  background: var(--normal-cell-color);
  overflow: hidden;
}
.ip-host { isolation: isolate; max-width: 100%; }
.masque-sim-chip {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 20;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px 4px 6px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 28%, transparent);
  background: transparent;
  color: var(--pluto-output-color);
  font-family: var(--lato-ui-font-stack);
  font-size: 0.72rem;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: 0.01em;
  cursor: help;
  user-select: none;
}
.masque-sim-chip-icon {
  width: 13px;
  height: 13px;
  flex: 0 0 auto;
}
.masque-sim-chip-label code {
  font-family: var(--julia-mono-font-stack);
  font-size: 0.92em;
  font-weight: 600;
}
.masque-sim-tip {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: max-content;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid color-mix(in srgb, var(--pluto-output-color) 22%, transparent);
  background: var(--pluto-output-bg-color);
  color: var(--pluto-output-color);
  box-shadow: 0 6px 18px color-mix(in srgb, #000 16%, transparent);
  font-size: 0.72rem;
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: 0;
  text-align: left;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-2px);
  transition: opacity 80ms ease, visibility 80ms ease, transform 80ms ease;
}
.masque-sim-chip:hover .masque-sim-tip,
.masque-sim-chip:focus-visible .masque-sim-tip {
  opacity: 1;
  visibility: visible;
  transform: none;
}
pluto-input {
  display: block;
  position: relative;
}
/* Unfolded source stands in for Pluto's CodeMirror box: same border, same token colors. */

pre.masque-src .hljs-string { color: var(--cm-color-string); }
pre.masque-src .hljs-symbol { color: var(--cm-color-symbol); }

pre.masque-src .hljs-meta { color: var(--cm-color-macro); font-weight: 700; }

      <div class="markdown"><p><strong>3 stations</strong></p>
<table><tr><th align="right">Station</th><th align="right">Region</th></tr><tr><td align="right">Boise</td><td align="right">Interior</td></tr><tr><td align="right">Salt Lake City</td><td align="right">Interior</td></tr><tr><td align="right">Denver</td><td align="right">Interior</td></tr></table>
</div>
    </div>
  </pluto-output>
</pluto-cell>


  </pluto-notebook>
  <script>
{
  function layerIndexKey(layer, index) {
  return String(layer) + ":" + String(Number(index));
}
function pickKey(v) {
  const k = layerIndexKey(v.layer, v.index);
  return v.sample == null ? k : k + "@" + String(Number(v.sample));
}
function itemKey(it) {
  const k = pickKey(it);
  const p = it.payload;
  if (!p || p.i0 == null) return k;
  return k + "@" + p.i0 + "-" + p.i1 + "/" + p.j0 + "-" + p.j1;
}
function envKey(v) {
  if (v == null) return "null";
  if (Array.isArray(v.items)) return "items:" + v.items.map(itemKey).join(",");
  if (v.layer != null && v.index != null && v.index !== "") {
    return pickKey(v);
  }
  return JSON.stringify(v);
}
function stable(x) {
  if (x === undefined) x = null;
  if (x === null || typeof x !== "object") return JSON.stringify(x);
  if (Array.isArray(x)) return "[" + x.map(stable).join(",") + "]";
  return "{" + Object.keys(x).sort().map(function (k) { return JSON.stringify(k) + ":" + stable(x[k]); }).join(",") + "}";
}
// A field keys the same as its starting value when it shows the same thing: a box released
// where it started keeps its cells though its edges differ in the last float digit.
function changed(table, v) {
  const out = [];
  const init = table.initial || {};
  (table.keyed || []).forEach(function (f) {
    const cur = v[f] === undefined ? null : v[f];
    const start = init[f] === undefined ? null : init[f];
    if (stable(cur) !== stable(start) && fieldKey(table, f, cur) !== fieldKey(table, f, start)) out.push([f, cur]);
  });
  return out;
}
function fieldKey(table, f, cur) {
  if (cur == null) return "null@" + f;
  if ((table.controls || []).indexOf(f) !== -1) return f + "=" + JSON.stringify(cur.payload);
  return envKey(cur);
}
function keyOf(table, v) {
  if (v == null) return "null";
  const d = changed(table, v);
  if (!d.length) return "null";
  return d.map(function (p) { return fieldKey(table, p[0], p[1]); }).join("+");
}
function keysFor(table, v) {
  const keys = [keyOf(table, v)];
  const d = v == null ? [] : changed(table, v);
  const one = d.length === 1 ? d[0][1] : null;
  if (one && one.layer != null && one.index != null && one.index !== "") {
    keys.push(String(one.layer) + ":" + String(one.index));
    keys.push(String(one.layer) + ":" + String(one.index | 0));
  }
  return keys;
}
function find(table, keys) {
  for (let i = 0; i < keys.length; i++) {
    if (Object.prototype.hasOwnProperty.call(table.keys, keys[i])) {
      return table.snaps[table.keys[keys[i]]];
    }
  }
  return null;
}
// Fetches each state file once and keeps it; a failed fetch is tried again next time.
function jsonFiles() {
  const loaded = new Map();
  return function (file) {
    if (!loaded.has(file)) {
      loaded.set(file, fetch(file).then(function (r) {
        if (!r.ok) throw new Error(file + ": " + r.status);
        return r.json();
      }).catch(function (e) {
        loaded.delete(file);
        throw e;
      }));
    }
    return loaded.get(file);
  };
}
// Shows each value's cells once its file loads, unless the reader reached a newer value first,
// a miss included: a slow file never lands over a newer value's cells or its note.
function latestOnly(load, apply, miss) {
  let latest = 0;
  return function (file) {
    const n = ++latest;
    miss(!file);
    if (!file) return;
    load(file).then(function (snap) {
      if (n === latest) apply(snap);
    }, function (e) {
      console.warn("masque player: snapshot", e);
      if (n === latest) miss(true);
    });
  };
}
// A reader who clicks one plot and then another changes two fields, a value the harvest never
// recorded. Show the latest change on its own: the field that differs from the last value.
function lookup(table, v) {
  const prev = table.last_;
  table.last_ = v;
  let hit = find(table, keysFor(table, v));
  // A moved control changes what every other field's snapshot would show, so a value the
  // harvest skipped stays a miss rather than showing a snapshot taken at other settings.
  const controlMoved = v != null && changed(table, v).some(function (p) { return (table.controls || []).indexOf(p[0]) !== -1; });
  if (!hit && v != null && prev != null && !controlMoved) {
    const moved = (table.keyed || []).filter(function (f) { return stable(v[f]) !== stable(prev[f]); });
    if (moved.length === 0) return table.shown_ || null;
    if (moved.length === 1) {
      const alone = Object.assign({}, table.initial || {});
      alone[moved[0]] = v[moved[0]];
      hit = find(table, keysFor(table, alone));
    }
  }
  if (hit) table.shown_ = hit;
  return hit;
}

  function sizeFrame() {
    if (!window.frameElement) return;
    window.frameElement.style.overflow = "hidden";
    window.frameElement.setAttribute("scrolling", "no");
    const nb = document.querySelector("pluto-notebook");
    const padBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
    const bottom = (nb ? nb.getBoundingClientRect().bottom : document.documentElement.scrollHeight) + padBottom;
    window.frameElement.style.height = Math.max(1, Math.ceil(bottom)) + "px";
  }
  const host = document.querySelector(".ip-host");
  const idlePng = (host && host.querySelector("img") && host.querySelector("img").getAttribute("src")) || "";
  // innerHTML does not run scripts. A swapped cell can be another widget, so
  // rebuild each inline script or the selected highlight never mounts.
  function setCellHtml(el, html) {
    el.innerHTML = html;
    el.querySelectorAll("script").forEach(function (old) {
      if (old.src) return;
      const s = document.createElement("script");
      for (let i = 0; i < old.attributes.length; i++) {
        s.setAttribute(old.attributes[i].name, old.attributes[i].value);
      }
      s.text = old.textContent;
      old.replaceWith(s);
    });
  }
  function apply(snap) {
    const img = host.querySelector("img");
    if (img) {
      const next = snap.png || idlePng;
      if (next && img.getAttribute("src") !== next) img.src = next;
    }
    const out = document.getElementById("masque-out");
    if (out && Array.isArray(snap.cells)) setCellHtml(out, snap.cells.join("\n"));
    if (snap.cells && !Array.isArray(snap.cells)) {
      Object.keys(snap.cells).forEach(function (id) {
        const el = document.querySelector('[data-masque-cell="' + id + '"]');
        if (el) setCellHtml(el, snap.cells[id]);
      });
    }
    sizeFrame();
  }
  // Each state's cells (and a remounted picture) are a file fetched when the reader gets there.
  const show = latestOnly(jsonFiles(), apply, function () {});
  function applyFromHost(host) {
    const man = host && host.masqueManifest;
    const snaps = man && man.snapshots;
    if (!snaps) return false;
    const file = lookup(snaps, host.value);
    if (!file && host.value != null) console.warn("masque player: no snapshot for", keyOf(snaps, host.value));
    show(file);
    return !!file;
  }
  if (host) {
    let cur = host.value;
    Object.defineProperty(host, "value", {
      configurable: true,
      enumerable: true,
      get: function () { return cur; },
      set: function (v) {
        cur = v;
        applyFromHost(host);
        sizeFrame();
      },
    });
    const dispatch = host.dispatchEvent.bind(host);
    host.dispatchEvent = function (ev) {
      const ok = dispatch(ev);
      if (ev && ev.type === "input") {
        applyFromHost(host);
        sizeFrame();
      }
      return ok;
    };
    host.addEventListener("input", function () {
      applyFromHost(host);
      sizeFrame();
    });
    applyFromHost(host);
  }
  sizeFrame();
  window.addEventListener("load", sizeFrame);
}
  </script>
