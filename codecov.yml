# One blended project number: Julia + frontend/src. Ignore committed
# IIFE/ESM bundles and tests. Flags on the upload are labels only —
# they do not split codecov/project (that split + carryforward + components
# was tried and reverted — see this PR's history — because it hid the
# baseline shift from adding frontend/src instead of accepting it).
ignore:
  - "assets/**"
  - "frontend/test/**" # vitest specs (frontend/)
  - "test/**"          # Julia test suite (repo root) — a different tree, not a duplicate of the line above

# No PR comment: the codecov/project and codecov/patch status checks carry the result,
# and a comment (re-edited on every push) emails everyone watching the PR.
comment: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    # Unconfigured `patch` defaults to target: auto with NO threshold, which is what
    # failed codecov/patch on #62. Same 1% leniency as `project`, not a Julia-only carve-out.
    patch:
      default:
        target: auto
        threshold: 1%

# Draft and docs-only PRs skip the Julia jobs, and a failed or cancelled job skips its upload.
# Carryforward keeps the last upload of a flag that didn't report, so the number reads as "no
# new data this run", not a coverage cliff. The flip side: a retired flag carries forward
# forever, so a job that goes lists its flag below with carryforward off.
flag_management:
  default_rules:
    carryforward: true
  # Retired with the shared-setup CI (#392): Julia 1 now uploads all Julia coverage.
  individual_flags:
    - name: julia-1.10
      carryforward: false
    - name: no-backend
      carryforward: false
    - name: webgl
      carryforward: false
